# =====================================================================================
#  HatChanger - slicer tool commands, standalone (no AFC)
#
#  install.sh --standalone copies this file to ~/printer_data/config/hatchanger/ once: add
#  a T<n> there for each extra rack. Don't include it with AFC (AFC creates T0, T1, ...).
# =====================================================================================

[gcode_macro T0]
gcode: HAT_CHANGE LANE=0
[gcode_macro T1]
gcode: HAT_CHANGE LANE=1
# [gcode_macro T2]
# gcode: HAT_CHANGE LANE=2     # one per extra rack, after adding its X to lane_x
