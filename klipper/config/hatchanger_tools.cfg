# =====================================================================================
#  HatChanger - slicer tool commands, standalone (no AFC)
#
#  install.sh --standalone copies it to ~/printer_data/config/hatchanger/ (once: add a T<n>
#  there per extra rack) and writes the includes.
#  Include this file ONLY when HatChanger runs on its own:
#      [include hatchanger.cfg]
#      [include hatchanger_tools.cfg]
#  With AFC, do NOT include it: AFC creates T0, T1, ... itself and maps them to the hat lanes
#  (hatchanger_afc.cfg). Two definitions of T0 would make AFC skip to T2.
# =====================================================================================

[gcode_macro T0]
gcode: HAT_CHANGE LANE=0
[gcode_macro T1]
gcode: HAT_CHANGE LANE=1
# [gcode_macro T2]
# gcode: HAT_CHANGE LANE=2     # uncomment one per extra rack, after adding its X to lane_x
