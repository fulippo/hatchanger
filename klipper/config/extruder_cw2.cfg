# HatChanger extruder profile: Clockwork 2 (main_body_hatchanger_cw2, 40 mm stinger set with
# stinger_gauge_cw2). install.sh links this file as hatchanger/hatchanger_extruder.cfg and
# includes it right after hatchanger.cfg, so these values replace the G2E defaults there.
# They come from the CAD (cad/source/hatchanger_cad.py, cw2_profile): MEASURE them and put your
# own in hatchanger_user.cfg (included last), which wins over this file.
[gcode_macro _HAT_CFG]
variable_extruder: 'cw2'
variable_nozzle_to_nip: 67.2        # the CW2 nip is 13.9 mm lower than the G2E one, same hotend and blade
variable_nip_to_sensor: 10.12       # after-gears D2F ball (the CW2 body's pre-gear sensor is filled)
variable_nip_to_cut: 24.4           # FilamATrix blade
# A docked hat hangs 40 mm of bowden + ~13 mm of filament: ~19.5 mm more than on G2E.
# The print-height limit for a change goes down by the same amount.
variable_z_clear: 62.0
variable_z_clear_loaded: 92.0
# dock_z: the hat sits 5.5 mm higher on the head than on G2E, so dock_z comes out ~5.5 mm lower.
# Calibrate it with HAT_CAL_DOCK (in hatchanger_user.cfg) after switching.
