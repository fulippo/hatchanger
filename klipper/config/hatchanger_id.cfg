# =====================================================================================
#  HatChanger hat ID - ADS1115 reader (docs/HAT_ID.md)
#
#  Each hat carries a resistor across its two bottom magnets; with the hat seated, the two
#  head magnets connect it to the reader. R1 (10k) to 5V and the hat
#  resistor form a divider on AIN0; AIN1 reads the 5V rail through the same RC. So:
#      R_hat = 10k * V(AIN0) / (V(AIN1) - V(AIN0))      (independent of the actual 5V level)
#
#  Wiring: the reader goes to the SB2209 USB 'I2C' header (5V, GND, SCL=GPIO29, SDA=GPIO28,
#  5 V level-shifted on the SB2209). Hat contacts: the two wires from under the head magnets (any order).
#  Add  [include hatchanger_id.cfg]  to printer.cfg. Replace 'EBB' with your toolboard's [mcu] name.
#
#  Commands:  HAT_ID              -> report which hat is on the head (or none)
#             HAT_ID_CHECK LANE=n -> error unless hat n is on the head (LANE=-1: unless the head is empty)
# =====================================================================================

[ads1x1x hat_adc]
chip: ADS1115
i2c_mcu: EBB
i2c_software_scl_pin: EBB:gpio29
i2c_software_sda_pin: EBB:gpio28
address_pin: GND               # ADDR is tied to GND: 0x48
pga: 6.144V                    # full scale above the 5 V supply
adc_voltage: 5.0

# The readings are published as 'temperatures' in millivolts (0-5000). The leading '_' in the
# sensor names hides them in Mainsail / Fluidd; HAT_ID prints the values when you need them.
[adc_temperature hat_id_millivolts]
temperature1: 0
voltage1: 0
temperature2: 5000
voltage2: 5.0

[temperature_sensor _hat_id]
sensor_type: hat_id_millivolts
sensor_pin: hat_adc:AIN0
adc_voltage: 5.0
min_temp: -100                 # wide on purpose (Klipper allows down to -273.15): no reading is ever "out of range"
max_temp: 7000

[temperature_sensor _hat_id_ref]
sensor_type: hat_id_millivolts
sensor_pin: hat_adc:AIN1
adc_voltage: 5.0
min_temp: -100
max_temp: 7000

[gcode_macro _HAT_ID_CFG]
variable_pullup: 10000.0       # divider resistor R1 (1 %)
# Resistor in each hat, by lane (index 0 = first lane in _HAT_CFG lane_x). Any values work if
# neighbours are at least ~1.7x apart and all are between ~220 R and ~100k.
variable_lane_ohms: [1000, 2200, 4700, 10000, 22000, 47000]
variable_tolerance: 1.3        # a reading matches a lane within x/÷ this factor
variable_settle_ms: 1000       # wait for fresh samples before deciding (sensors update every 0.3 s)
gcode:

[gcode_macro _HAT_ID_STATE]
variable_lane: -1              # detected hat, -1 = none / unknown
variable_ohms: -1.0
variable_status: 'unread'      # ok | empty | short | unknown | no_reference
gcode:

[gcode_macro _HAT_ID_READ]
gcode:
  {% set c = printer["gcode_macro _HAT_ID_CFG"] %}
  {% set v0 = printer["temperature_sensor _hat_id"].temperature %}
  {% set v1 = printer["temperature_sensor _hat_id_ref"].temperature %}
  {% set ns = namespace(lane=-1, ohms=-1.0, status='ok') %}
  {% if v1 < 4000 %}
    {% set ns.status = 'no_reference' %}
  {% elif v0 >= 0.97 * v1 %}
    {% set ns.status = 'empty' %}
  {% elif v0 <= 0.01 * v1 %}
    {% set ns.status = 'short' %}
  {% else %}
    {% set ns.ohms = c.pullup * v0 / (v1 - v0) %}
    {% for r in c.lane_ohms %}
      {% if ns.ohms < r * c.tolerance and ns.ohms * c.tolerance > r %}
        {% set ns.lane = loop.index0 %}
      {% endif %}
    {% endfor %}
    {% if ns.lane < 0 %}
      {% set ns.status = 'unknown' %}
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_HAT_ID_STATE VARIABLE=lane VALUE={ns.lane}
  SET_GCODE_VARIABLE MACRO=_HAT_ID_STATE VARIABLE=ohms VALUE={ns.ohms}
  SET_GCODE_VARIABLE MACRO=_HAT_ID_STATE VARIABLE=status VALUE='"{ns.status}"'

[gcode_macro _HAT_ID_PRINT]
gcode:
  {% set s = printer["gcode_macro _HAT_ID_STATE"] %}
  {% set v0 = printer["temperature_sensor _hat_id"].temperature %}
  {% set v1 = printer["temperature_sensor _hat_id_ref"].temperature %}
  {% if s.status == 'ok' %}
    RESPOND MSG="Hat ID: lane {s.lane} ({'%.0f' % s.ohms} ohm)"
  {% elif s.status == 'empty' %}
    RESPOND MSG="Hat ID: no hat on the head (open circuit)"
  {% elif s.status == 'unknown' %}
    RESPOND TYPE=error MSG="Hat ID: {'%.0f' % s.ohms} ohm matches no lane in _HAT_ID_CFG lane_ohms"
  {% elif s.status == 'short' %}
    RESPOND TYPE=error MSG="Hat ID: short circuit (wires touching, or a magnet bridging the contacts)"
  {% else %}
    RESPOND TYPE=error MSG="Hat ID: reference channel reads {'%.0f' % v1} mV: check the reader's 5V / AIN1"
  {% endif %}
  RESPOND MSG="Hat ID raw: AIN0 {'%.0f' % v0} mV, AIN1 {'%.0f' % v1} mV"

[gcode_macro HAT_ID]
description: Report which hat is seated on the head (resistor through the magnets)
gcode:
  G4 P{printer["gcode_macro _HAT_ID_CFG"].settle_ms}
  _HAT_ID_READ
  _HAT_ID_PRINT

[gcode_macro HAT_ID_CHECK]
description: Raise an error unless hat LANE is on the head (LANE=-1: unless the head is empty)
gcode:
  {% set want = params.LANE|default(-1)|int %}
  G4 P{printer["gcode_macro _HAT_ID_CFG"].settle_ms}
  _HAT_ID_READ
  _HAT_ID_ASSERT LANE={want}

[gcode_macro _HAT_ID_ASSERT]
gcode:
  {% set want = params.LANE|int %}
  {% set s = printer["gcode_macro _HAT_ID_STATE"] %}
  {% if want < 0 and s.status != 'empty' %}
    {action_raise_error("HatChanger: the head should be empty but the hat ID reads '%s' (lane %d, %.0f ohm)" % (s.status, s.lane, s.ohms))}
  {% elif want >= 0 and (s.status != 'ok' or s.lane != want) %}
    {action_raise_error("HatChanger: expected hat %d on the head, the hat ID reads '%s' (lane %d, %.0f ohm)" % (want, s.status, s.lane, s.ohms))}
  {% endif %}
