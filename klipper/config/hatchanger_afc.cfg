# =====================================================================================
#  HatChanger as an AFC unit (Armored Turtle AFC-Klipper-Add-On)
#
#  AFC handles the T commands, lane mapping, Spoolman and the UI; the HatChanger macros do
#  every move through klipper/extras/AFC_HatChanger.py. Setup: docs/AFC.md.
#
#  install.sh --afc copies this file to ~/printer_data/config/hatchanger/ once: edit your
#  lanes there. Don't include hatchanger_tools.cfg with it (AFC creates T0, T1, ...).
# =====================================================================================

[AFC_HatChanger HatChanger_1]
extruder: extruder
# hat_id_check: True            # with hatchanger_id.cfg: HAT_ID_CHECK after every pickup / drop-off
# leave_stub_for_poop: auto     # auto | true | false: leave the cut stub for AFC's poop_cmd
                                #   (auto: when poop is on; otherwise it's pushed out at load_park_xy)

# No pins: the after-gears sensor belongs to the HatChanger macros.
[AFC_extruder extruder]

# One [AFC_lane] per rack: unit HatChanger_1:1 is lane 0 (the first X in lane_x), :2 is
# lane 1, and so on. map is optional: AFC assigns T0, T1, ... in order otherwise.
[AFC_lane hat0]
unit: HatChanger_1:1
hub: direct
map: T0

[AFC_lane hat1]
unit: HatChanger_1:2
hub: direct
map: T1

# [AFC_lane hat2]
# unit: HatChanger_1:3
# hub: direct
# map: T2

# Keeps AFC in step when hats are moved with the HatChanger commands. Merged into
# hatchanger.cfg's _HAT_CFG.
[gcode_macro _HAT_CFG]
variable_state_hook: 'AFC_HATCHANGER_SYNC UNIT=HatChanger_1 QUIET=1'
