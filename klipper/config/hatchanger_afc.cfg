# =====================================================================================
#  HatChanger as an AFC unit (Armored Turtle AFC-Klipper-Add-On)
#
#  AFC owns the T commands, lane mapping, Spoolman, colours, poop/wipe/kick and the UI;
#  the HatChanger macros (hatchanger.cfg) do every move. Needs klipper/extras/AFC_HatChanger.py
#  linked into klipper/klippy/extras (docs/AFC.md).
#
#  install.sh --afc copies this file to ~/printer_data/config/hatchanger/ (once: it's yours,
#  edit the lanes there) and writes the includes. By hand, printer.cfg needs:
#      [include hatchanger.cfg]
#      [include hatchanger_id.cfg]       # optional, hat-ID reader
#      [include hatchanger_afc.cfg]
#      [include AFC/*.cfg]               # AFC's own files, WITHOUT its AFC_Hardware.cfg / unit file
#  and NOT hatchanger_tools.cfg (AFC creates T0, T1, ...).
#
#  AFC.cfg: tool_cut: False, park: False, form_tip: False (HAT_DOCK cuts and parks the filament).
#  poop: True with your purge (poop_cmd: BLOBIFIER or AFC_POOP) - it also pushes out the ~43 mm
#  cut stub of the old filament, so purge that much more than the colour change alone needs.
# =====================================================================================

[AFC_HatChanger HatChanger_1]
extruder: extruder
# hat_id_check: True            # with hatchanger_id.cfg: check the hat ID after every pickup/drop-off
# leave_stub_for_poop: auto     # auto: leave the cut stub for AFC's poop_cmd when poop is on,
                                #   else HatChanger pushes it out at load_park_xy. true / false

# The toolhead extruder. No pins: the after-gears sensor belongs to the HatChanger macros
# ([filament_switch_sensor hat_toolhead] in hatchanger.cfg).
[AFC_extruder extruder]

# One [AFC_lane] per hat. unit: HatChanger_1:<n>, n = 1 for hat lane 0 (the first X in
# _HAT_CFG lane_x), 2 for hat lane 1, ... hub: direct (no hub, no lane motor).
# map: optional, AFC assigns T0, T1, ... in order otherwise (and you can remap from the UI).
[AFC_lane hat0]
unit: HatChanger_1:1
hub: direct
map: T0

[AFC_lane hat1]
unit: HatChanger_1:2
hub: direct
map: T1

# [AFC_lane hat2]
# unit: HatChanger_1:3
# hub: direct
# map: T2

# Keep AFC in step when hats are moved with the HatChanger commands (HAT_PICKUP, HAT_DOCK,
# HAT_SET_STATE, HAT_START...). Merged into hatchanger.cfg's _HAT_CFG, whatever the include order.
[gcode_macro _HAT_CFG]
variable_state_hook: 'AFC_HATCHANGER_SYNC UNIT=HatChanger_1 QUIET=1'
