# HatChanger extruder profile: Galileo 2 (front_body_hatchanger, 20.48 mm stinger).
# install.sh links this file as hatchanger/hatchanger_extruder.cfg and includes it right after
# hatchanger.cfg. The defaults in hatchanger.cfg are already the G2E values, so this profile only
# names the extruder. Your own measured values go in hatchanger_user.cfg (included last).
[gcode_macro _HAT_CFG]
variable_extruder: 'g2e'
