# =====================================================================================
#  HatChanger - Klipper macros
#
#  Cutter: FilamATrix arm on the head's -X side, pressed against a pin on the gantry. The
#  blade is ~38 mm below the gear nip. No tip forming.
#
#  Every filament move is referenced to the after-gears sensor (D2F + ball, nip_to_sensor
#  below the nip). The only state is WHICH hat is on the head and WHETHER it is loaded to
#  the nozzle.
#
#  Drop-off:  cut (if loaded) -> tip to grip_margin below the nip -> slide the hat into its
#             rack -> synced descent: Z down and E back together, so the filament stays in
#             the hat and slides out of the gears.
#  Pickup:    check the head is empty -> synced rise under the hat: Z up and E forward
#             together, so the gears take the hanging tip -> slide out -> grab check on the
#             sensor -> load to just above the old cut stub. The purge macro (or
#             load_park_xy) pushes the stub out.
#
#  Commands and the sequence in detail: docs/COMMANDS.md. With AFC: docs/AFC.md.
#
#  Requires [save_variables] (an existing one is reused) and [respond].
#  Errors stop the sequence (and a running print); there is no retry.
#  Moves without XY are extrude-only for Klipper: E moves are chunked to <= 40 mm, and the
#  synced Z+E moves are limited by max_extrude_only_velocity.
# =====================================================================================

[save_variables]
filename: ~/printer_data/config/hatchanger_vars.cfg

# After-gears filament sensor in front_body_hatchanger: D2F + 5.5 mm ball on the +X side,
# 19.85 mm below the gear nip. pause_on_runout is off: the macros read the sensor themselves.
# Wiring: COM -> GND, NC -> signal: filament present = switch open = pin high through the
# pull-up, so no '!'. With NO -> signal, add '!'.
# BTT SB2209 USB (RP2040): 'Endstop' port = GPIO13 if your X endstop isn't on it; otherwise
# the 'I2C' port, signal on GPIO29.
[filament_switch_sensor hat_toolhead]
switch_pin: ^EBB:gpio13      # replace EBB with the name of your toolboard's [mcu ...] section
pause_on_runout: False

# Defaults are the prototype's values. Set yours in hatchanger_user.cfg.
# Clockwork 2 (main_body_hatchanger_cw2), from the CAD: nozzle_to_nip ~67.2, nip_to_sensor 10.12,
# nip_to_cut ~24.4. 40 mm stinger (stinger_gauge_cw2); docked hats hang ~19.5 mm lower: z_clear ~62,
# z_clear_loaded ~92 (MEASURE), and dock_z ~5.5 mm lower (HAT_CAL_DOCK).
[gcode_macro _HAT_CFG]
# ---- filament path (MEASURE) ---------------------------------------------------------
variable_nozzle_to_nip: 81.1        # gear nip -> nozzle tip along the filament. Only used to push the cut stub
                                    #   out (stub = this - nip_to_cut, ~43 mm) when no purge macro follows
variable_grip_margin: 3.0           # pre-park: tip this far below the nip, still gripped by the gears
variable_nip_to_sensor: 19.85       # gear nip -> sensor ball (front_body_hatchanger)
variable_nip_to_cut: 38.35          # gear nip -> blade (FilamATrix)
variable_sensor_margin: 3.0         # grab check: extra push allowed beyond the expected distance
variable_release_margin: 10.0       # synced descent goes this far past the nip. Covers a long, tapered tip
                                    #   (the sensor only switches on the full diameter, up to ~10 mm late)
variable_sync_extra: 8.0            # pickup: the slow final stretch starts this much before the expected grab
# ---- dock (CALIBRATE) ----------------------------------------------------------------
variable_lane_x: [35.5, 105.0]      # X of each rack. Keep >= ~40 mm between racks, so the head passes the
                                    #   neighbours' stingers. One T<n> (standalone) or [AFC_lane] per rack
variable_dock_y_in: 7.0             # hat against the rack plate (HAT_CAL_DOCK STEP=2/3). Re-measure with a spacer
variable_dock_y_front: 33.3         # approach Y in front of the racks (dock_y_in + 18 + 8)
variable_seat_press: 0.4            # the head docks this far below dock_z, so the hat rests on the lower lips and
                                    #   is never pushed against the upper ones. dock_z may be this much too high
variable_plate_clear: 4.0           # last mm of the slide in (first mm out) run at plate_speed
variable_plate_speed: 5             # mm/s near the plate: the hat meets it gently, the magnets let go slowly
variable_lift: 0.6                  # rails clear the lower lips by this when sliding (= P.lift in the CAD).
                                    #   The upper lip is 1.2 mm above the seat: keep <= ~0.8
variable_dock_z: 244.5              # Z where the rails just touch the lips with the hat seated on the head.
                                    #   HAT_CAL_DOCK STEP=3, then jog down 0.1 mm at a time until they touch.
                                    #   Needs position_max Z >= dock_z + lift
variable_z_clear: 42.0              # empty head travels at dock_z - this: docked stinger + filament + dowels + margin
variable_z_clear_loaded: 72.0       # loaded head travels at dock_z - this: z_clear + hat + ECAS + bowden bend.
                                    #   Also the print height limit for a change (~175 mm on the prototype)
# ---- speeds (mm/s) -------------------------------------------------------------------
variable_travel_speed: 250
variable_z_speed: 20
variable_slide_speed: 15
variable_sync_speed: 5
variable_approach_len: 15.0         # pickup: the last mm of the rise before the synced move run slowly,
variable_approach_speed: 5          #   while the hanging tip enters the gears' lead-in
variable_probe_empty: True          # before every pickup, push probe_len forward and read the sensor: a hat whose
variable_probe_len: 40.0            #   filament is in the gears is detected and the pickup stops (nothing moved)
variable_seek_step: 1.0             # sensor seeks (pre-park, grab check) move in steps this long,
variable_seek_max: 45.0             #   for at most this far (more = gears skipping or filament stuck)
variable_park_speed: 8              # pre-park retract. Slow: a fast pull can lift the hat off the head magnets
variable_load_speed: 15
variable_stub_gap: 2.0              # loading stops this far above the blade, short of the cut stub
variable_load_park_xy: []           # [x, y] where the stub is pushed out when no purge macro follows. [] = in place
variable_load_park_z: 0             # Z for load_park_xy; 0 = keep the current Z
# ---- cutter (CALIBRATE) --------------------------------------------------------------
# Jog the head towards the pin (-X): cut_x_touch = X where the arm first touches the pin,
# cut_x_cut = X where it is fully pressed (blade through the filament). cut_y = Y of the pin.
variable_cut_x_touch: 16.0          # arm touches the pin. Equal to cut_x_cut = not calibrated: HAT_DOCK refuses to cut
variable_cut_x_cut: 10.0            # arm fully pressed
variable_cut_y: 77.0
variable_cut_approach: 5.0          # the press starts this far before cut_x_touch
variable_cut_z_hop: 2.0             # lift before travelling to the pin, so the nozzle clears the print
variable_cut_fast_speed: 150        # mm/s to the start of the press
variable_cut_press_speed: 20        # mm/s for the first part of the press (approach, up to the arm touching)
variable_cut_press_fast_fraction: 0.4   # fraction of the press run at cut_press_speed
variable_cut_slow_speed: 5          # mm/s for the rest of the press (blade through the filament)
variable_cut_dwell: 0.2             # s with the arm fully pressed
variable_cut_count: 2               # presses per cut (the second finishes a partial cut)
variable_cut_pull: 3.0              # after the cut, pull the filament up to this far below the sensor
# ---- temperature ---------------------------------------------------------------------
variable_min_melt_temp: 190         # lowest nozzle temp that melts every filament you load. Loading refuses below it
variable_melt_temp_tolerance: 5     # wait for the nozzle if it is more than this below the target
# ---- hooks ---------------------------------------------------------------------------
variable_purge_macro: 'BLOBIFIER'   # run after each change. It also pushes out the ~43 mm cut stub, so purge that
                                    #   much more than the colour change needs. '' = no purge (stub at load_park_xy)
variable_start_stub: 1              # HAT_START: 1 = push the stub out at load_park_xy; 0 = leave it to the start
                                    #   purge (only if it purges well over 45 mm)
variable_sensor: 'hat_toolhead'     # the after-gears sensor (required)
gcode:

[gcode_macro _HAT_STATE]
variable_lane: -1                   # hat on the head, -1 = none
variable_loaded: 0                  # 1 = its filament is loaded to the nozzle
variable_seek_done: 0
variable_seek_moved: 0.0
variable_align: 0
variable_align_lane: -1
variable_probe_hit: 0
gcode:

[delayed_gcode _HAT_RESTORE_STATE]
initial_duration: 1
gcode:
  {% set sv = printer.save_variables.variables %}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=lane VALUE={sv.hat_lane|default(-1)}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=loaded VALUE={sv.hat_loaded|default(0)}

# Every state change also runs _HAT_CFG state_hook, if set (hatchanger_afc.cfg sets it so AFC
# follows). It isn't declared in _HAT_CFG above, so another file can add it whatever the
# include order.
[gcode_macro _HAT_SET_LANE]
gcode:
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=lane VALUE={params.LANE|int}
  SAVE_VARIABLE VARIABLE=hat_lane VALUE={params.LANE|int}
  {% set hook = printer["gcode_macro _HAT_CFG"].state_hook|default('') %}
  {% if hook %}{hook}{% endif %}

[gcode_macro _HAT_SET_LOADED]
gcode:
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=loaded VALUE={params.V|int}
  SAVE_VARIABLE VARIABLE=hat_loaded VALUE={params.V|int}
  {% set hook = printer["gcode_macro _HAT_CFG"].state_hook|default('') %}
  {% if hook %}{hook}{% endif %}

# Fix the state after moving a hat by hand. Nothing moves.
[gcode_macro HAT_SET_STATE]
description: Tell HatChanger which hat is on the head (LANE, -1 = none) and whether it is loaded to the nozzle (LOADED)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.lane)|int %}
  {% set loaded = params.LOADED|default(st.loaded if lane >= 0 else 0)|int %}
  {% if lane < -1 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: LANE must be -1 (head empty) or 0.." ~ (c.lane_x|length - 1))}
  {% endif %}
  {% set seen = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  _HAT_SET_LANE LANE={lane}
  _HAT_SET_LOADED V={loaded if lane >= 0 else 0}
  RESPOND MSG="HatChanger: state set to lane {lane}, loaded {loaded if lane >= 0 else 0}"
  {% if lane < 0 and seen %}
    RESPOND TYPE=error MSG="HatChanger: WARNING the sensor sees filament, but you set the head EMPTY. A hat or a strand is on the head?"
  {% elif lane >= 0 and loaded and not seen %}
    RESPOND TYPE=error MSG="HatChanger: WARNING you set the hat LOADED, but the sensor sees no filament"
  {% endif %}

[gcode_macro _HAT_CHECK_READY]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
    {action_raise_error("HatChanger: run QUAD_GANTRY_LEVEL first (dock Z depends on it)")}
  {% endif %}
  {% if printer["gcode_macro _HAT_STATE"].align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ printer["gcode_macro _HAT_STATE"].align ~ " (head in a rack): run HAT_CAL_DOCK STEP=0 first. Nothing moved")}
  {% endif %}
  {% if not params.DRY|default(0)|int %}
    {% if not c.sensor %}
      {action_raise_error("HatChanger: the after-gears sensor is required (variable_sensor)")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
      {action_raise_error("HatChanger: extruder too cold to move filament")}
    {% endif %}
  {% endif %}

# Relative extruder move D mm (+ = down towards the nozzle), chunked to <= 40 mm.
[gcode_macro _HAT_E]
gcode:
  {% set d = params.D|float %}
  {% set f = params.SPEED|float * 60 %}
  {% set n = ((d|abs) / 40.0)|round(0, 'ceil')|int %}
  M83
  {% for i in range(n) %}
    G1 E{d / n} F{f}
  {% endfor %}
  M400

# Cut: lift cut_z_hop, go in front of the pin, press the arm cut_count times, come back.
# The extruder doesn't move. Works cold.
[gcode_macro _HAT_CUT_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if c.cut_x_touch == c.cut_x_cut %}
    {action_raise_error("HatChanger: the cutter is not calibrated (cut_x_touch / cut_x_cut / cut_y in _HAT_CFG)")}
  {% endif %}
  {% set s = 1 if c.cut_x_cut > c.cut_x_touch else -1 %}
  {% set x0 = c.cut_x_touch - s * c.cut_approach %}
  {% set xf = x0 + (c.cut_x_cut - x0) * c.cut_press_fast_fraction %}
  {% set p = printer.gcode_move.gcode_position %}
  {% set zt = c.dock_z - c.z_clear_loaded %}
  G90
  G1 Z{[p.z + c.cut_z_hop, [p.z, zt]|max]|min} F{c.z_speed * 60}
  G1 X{x0} Y{c.cut_y} F{c.cut_fast_speed * 60}
  {% for i in range(c.cut_count|int) %}
    G1 X{xf} F{c.cut_press_speed * 60}
    G1 X{c.cut_x_cut} F{c.cut_slow_speed * 60}
    G4 P{(c.cut_dwell * 1000)|int}
    G1 X{x0} F{c.cut_press_speed * 60}
  {% endfor %}
  M400

# Cut once, for calibrating the pin position. A loaded hat stays loaded above the cut.
[gcode_macro HAT_CUT]
description: Press the FilamATrix arm against the pin (cut_count times) and come back
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer["gcode_macro _HAT_STATE"].align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ printer["gcode_macro _HAT_STATE"].align ~ " (head in a rack): run HAT_CAL_DOCK STEP=0 first. Nothing moved")}
  {% endif %}
  SAVE_GCODE_STATE NAME=hat_cut
  _HAT_CUT_MOVES
  RESTORE_GCODE_STATE NAME=hat_cut MOVE=1

# Error if the nozzle target is below MIN (never push filament into a nozzle that can't melt
# it); wait if the nozzle hasn't reached the target yet.
[gcode_macro _HAT_CHECK_MELT]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set min_t = params.MIN|default(c.min_melt_temp)|float %}
  {% set what = params.WHAT|default("filament move") %}
  {% set target = printer.extruder.target|float %}
  {% set temp = printer.extruder.temperature|float %}
  {% if target < min_t %}
    {action_raise_error("HatChanger: " ~ what ~ " needs the nozzle at >= " ~ min_t ~ " C to melt the filament, target is " ~ target ~ " C. Set the temperature first (M109 S...)")}
  {% endif %}
  {% if temp < target - c.melt_temp_tolerance %}
    RESPOND MSG="HatChanger: waiting for the nozzle to reach {target} C before the {what}"
    M109 S{target}
  {% endif %}

# ---- sensor seek ----------------------------------------------------------------------
# Move the filament in seek_step steps until the sensor reads WANT (0 = clear: retract,
# 1 = filament: push), for at most MAX mm, else raise WHAT. Each step is its own macro, so it
# reads the sensor after the previous move.
[gcode_macro _HAT_SEEK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set max = params.MAX|default(c.seek_max)|float %}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_done VALUE=0
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_moved VALUE=0.0
  {% for i in range((max / c.seek_step)|round(0, 'ceil')|int) %}
    _HAT_SEEK_STEP WANT={params.WANT|int}
  {% endfor %}
  _HAT_SEEK_END WANT={params.WANT|int} WHAT="{params.WHAT|default('sensor seek failed')}"

[gcode_macro _HAT_SEEK_STEP]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set want = params.WANT|int %}
  {% if st.seek_done|int == 0 %}
    {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected == (want == 1) %}
      SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_done VALUE=1
    {% else %}
      M83
      G1 E{c.seek_step if want == 1 else -c.seek_step} F{c.park_speed * 60}
      M400
      G4 P60
      SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_moved VALUE={st.seek_moved|float + c.seek_step}
    {% endif %}
  {% endif %}

[gcode_macro _HAT_SEEK_END]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set ok = printer["filament_switch_sensor " ~ c.sensor].filament_detected == (params.WANT|int == 1) %}
  {% if not ok %}
    {action_raise_error("HatChanger: " ~ params.WHAT ~ " (moved " ~ st.seek_moved ~ " mm)")}
  {% endif %}

# Pre-park: seek the sensor edge from either side, then retract to grip_margin below the nip.
[gcode_macro _HAT_PREPARK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if not printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    # tip above the ball: push it down to the ball first (only works if it is in the gears)
    _HAT_SEEK WANT=1 MAX={c.nip_to_sensor + 5} WHAT="pre-park: pushing does not bring filament to the sensor: the tip is not in the gears (above them, or snapped). Push the filament down by hand (through the bowden) until HAT_STATUS shows the sensor DETECTED, then run HAT_DOCK again"
  {% endif %}
  _HAT_SEEK WANT=0 WHAT="pre-park: the sensor still sees filament: the gears are skipping (filament stuck in the bowden / hat lifted?), a strand snapped below the gears, or the last cut did not go through (check the blade and cut_x_cut)"
  _HAT_E D=-{c.nip_to_sensor - c.grip_margin} SPEED={c.park_speed}

# Grab check after a pickup: push until the sensor sees filament. If the tip is already past
# the sensor, pull it back first, so it always ends at the ball: loading is a fixed distance
# from there. Call it after an M400.
[gcode_macro _HAT_GRAB_CHECK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    _HAT_SEEK WANT=0 WHAT="pickup: the filament is past the sensor and pulling back does not clear it: the gears are skipping (filament stuck in the bowden / hat lifted?)"
  {% endif %}
  _HAT_SEEK WANT=1 MAX={c.nip_to_sensor + c.sensor_margin + 15} WHAT="pickup: no filament reached the sensor: the grab failed (tip not taken by the gears). The state now says this hat is ON the head. Check by hand: if it is on the head, push its filament down by hand until HAT_STATUS shows the sensor DETECTED, then HAT_DOCK; if it stayed in the rack, HAT_SET_STATE LANE=-1"

# ---- empty-head probe (before a pickup) -----------------------------------------------
# Push probe_len forward, read the sensor, always retract the same amount, then judge. A hat
# whose filament is in the gears is detected; a tip above the gears isn't.
[gcode_macro _HAT_PROBE_EMPTY]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set ctx = params.CONTEXT|default("pickup") %}
  {% if c.sensor and c.probe_empty %}
    {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
      {action_raise_error("HatChanger: (" ~ ctx ~ ") the sensor already sees filament with no hat expected on the head: a hat is on it, or a strand is stuck below the gears. Check by hand, fix the state with HAT_SET_STATE")}
    {% endif %}
    {% set dist = [c.probe_len, params.DIST|default(0)|float]|max %}
    {% set k = (dist / 40.0)|round(0, 'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=probe_hit VALUE=0
    M83
    {% for i in range(k) %}
      G1 E{dist / k} F{c.load_speed * 60}
    {% endfor %}
    M400
    G4 P80
    _HAT_PROBE_READ
    {% for i in range(k) %}
      G1 E-{dist / k} F{c.load_speed * 60}
    {% endfor %}
    M400
    _HAT_PROBE_JUDGE CONTEXT={ctx} LANE={params.LANE|default(-1)}
  {% endif %}

[gcode_macro _HAT_PROBE_READ]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=probe_hit VALUE=1
  {% endif %}

[gcode_macro _HAT_PROBE_JUDGE]
gcode:
  {% set hit = printer["gcode_macro _HAT_STATE"].probe_hit|int %}
  {% set lane = params.LANE|default(-1)|int %}
  {% if hit and params.CONTEXT == "dropoff" %}
    _HAT_SET_LANE LANE={lane}
    _HAT_PROBE_FAIL MSG="after the drop-off the head still carries a hat (filament grabbed by the probe): hat {lane} did not stay in its rack. State set back to hat {lane} on the head."
  {% elif hit %}
    _HAT_PROBE_FAIL MSG="before the pickup the probe grabbed filament: a hat is already on the head although the state says it is empty. Nothing moved. Dock it (or remove it by hand) and fix the state with HAT_SET_STATE LANE=<n>."
  {% endif %}

[gcode_macro _HAT_PROBE_FAIL]
gcode:
  {action_raise_error("HatChanger: " ~ params.MSG)}

# DRY runs never turn the extruder, so no filament may be in the gears. The sensor only sees
# filament below the ball: pulling the filament out of the hats is up to you.
[gcode_macro _HAT_DRY_CHECK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% if c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    {action_raise_error("HatChanger DRY: the sensor sees filament: pull it back above the gears (out of the hats) first")}
  {% endif %}
  {% if st.lane|int >= 0 and st.loaded|int %}
    {action_raise_error("HatChanger DRY: hat " ~ st.lane ~ " is loaded to the nozzle: unload it with HAT_DOCK first")}
  {% endif %}

# Loaded head: go in front of its empty rack, at the loaded travel height.
[gcode_macro _HAT_GO_DOCK_FRONT]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set x = c.lane_x[params.LANE|int] %}
  {% set p = printer.toolhead.position %}
  {% set zt = c.dock_z - c.z_clear_loaded %}
  {% if p.z > zt + 0.01 %}
    {action_raise_error("HatChanger: head is above the loaded travel height - print too tall for the dock zone")}
  {% endif %}
  G90
  G1 Z{[p.z + 1.0, zt]|min} F{c.z_speed * 60}
  {% if c.dock_y_in > c.dock_y_front %}
  G1 Y{[p.y, c.dock_y_front]|min} F{c.travel_speed * 60}
  {% else %}
  G1 Y{[p.y, c.dock_y_front]|max} F{c.travel_speed * 60}
  {% endif %}
  G1 Z{zt} F{c.z_speed * 60}
  G1 X{x} Y{c.dock_y_front} F{c.travel_speed * 60}

[gcode_macro _HAT_DOCK_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set rel = params.RELEASE|default(c.release_margin)|float %}
  {% set dry = params.DRY|default(0)|int %}
  {% set d = c.grip_margin + rel %}
  G90
  # slide in with the rails lift mm above the lower lips, the last plate_clear mm slowly
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  {% set y_pre = c.dock_y_in + s * c.plate_clear %}
  G1 Z{c.dock_z + c.lift} F{c.z_speed * 60}
  G1 Y{y_pre} F{c.slide_speed * 60}
  G1 Y{c.dock_y_in} F{c.plate_speed * 60}
  # set the hat down on the lower lips (the V centres it in X and Z)
  {% set zd = c.dock_z - c.seat_press %}
  G1 Z{zd} F{c.sync_speed * 60}
  M400
  # synced descent: Z down and E back together, so the filament stays still in the hat
  {% if dry %}
  G1 Z{zd - d} F{c.sync_speed * 60}
  {% else %}
  M83
  G1 Z{zd - d} E-{d} F{c.sync_speed * 60}
  {% endif %}
  G1 Z{c.dock_z - c.z_clear} F{c.z_speed * 60}
  _HAT_SET_LANE LANE=-1
  _HAT_SET_LOADED V=0

[gcode_macro _HAT_PICKUP_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set lane = params.LANE|int %}
  {% set x = c.lane_x[lane] %}
  {% set p = printer.toolhead.position %}
  {% set ze = c.dock_z - c.z_clear %}
  {% set dry = params.DRY|default(0)|int %}
  {% if p.z > ze + 0.01 %}
    {action_raise_error("HatChanger: empty head above its safe travel height")}
  {% endif %}
  G90
  G1 Z{ze} F{c.z_speed * 60}
  G1 X{x} Y{c.dock_y_in} F{c.travel_speed * 60}
  # The whole rise is synced: Z up and E forward together, so the gear teeth stand still
  # relative to the hanging tip and take it wherever it hangs. Slow over the last
  # approach_len + sync_extra mm. Ends seat_press below dock_z; the hat seats when lifting.
  {% set zs = c.dock_z - c.grip_margin - c.sync_extra %}
  {% set zf = c.dock_z - c.seat_press %}
  {% set e = 0 if dry else 1 %}
  M83
  G1 Z{zs - c.approach_len} E{e * (zs - c.approach_len - ze)} F{c.z_speed * 60}
  G1 Z{zs} E{e * c.approach_len} F{c.approach_speed * 60}
  G1 Z{zf} E{e * (zf - zs)} F{c.sync_speed * 60}
  # lift to mid-channel, pull off the rack magnets slowly, slide out
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  G1 Z{c.dock_z + c.lift} F{c.sync_speed * 60}
  G1 Y{c.dock_y_in + s * c.plate_clear} F{c.plate_speed * 60}
  G1 Y{c.dock_y_front} F{c.slide_speed * 60}
  G1 Z{c.dock_z - c.z_clear_loaded} F{c.z_speed * 60}
  _HAT_SET_LANE LANE={lane}
  _HAT_SET_LOADED V=0
  M400
  {% if not dry %}
    _HAT_GRAB_CHECK
  {% endif %}

# ---- user commands --------------------------------------------------------------------

# HAT_DOCK cuts whenever the sensor sees filament, even if the state says not loaded, unless
# CUT=0 (refused for a loaded hat). Then it pre-parks on the sensor and docks.
[gcode_macro HAT_DOCK]
description: Park the hat on the head in its rack (cuts the filament first if loaded). RELEASE=mm overrides release_margin. DRY=1: movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = st.lane|int %}
  {% set dry = params.DRY|default(0)|int %}
  {% set loaded = st.loaded|int %}
  {% set sensed = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  {% set cut = not dry and sensed and (loaded or params.CUT|default(1)|int) %}
  {% if lane < 0 %}
    RESPOND MSG="HatChanger: no hat on the head"
  {% else %}
    {% if dry %}
      _HAT_DRY_CHECK
    {% elif loaded and params.CUT|default(1)|int == 0 %}
      {action_raise_error("HatChanger: hat " ~ lane ~ " is loaded to the nozzle, it must be cut: run HAT_DOCK without CUT=0")}
    {% endif %}
    _HAT_CHECK_READY DRY={dry}
    SAVE_GCODE_STATE NAME=hat_unload
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    {% if cut %}
      _HAT_CUT_MOVES
      {% if loaded %}
      # the cut end is nip_to_cut below the gears: bring it up to cut_pull below the sensor fast,
      # the seek in the pre-park does the rest
      _HAT_E D=-{c.nip_to_cut - c.nip_to_sensor - c.cut_pull} SPEED={c.park_speed}
      {% endif %}
    {% endif %}
    {% if not dry %}
      _HAT_PREPARK
      _HAT_SET_LOADED V=0
    {% endif %}
    _HAT_GO_DOCK_FRONT LANE={lane}
    _HAT_DOCK_MOVES RELEASE={params.RELEASE|default(c.release_margin)} DRY={dry}
    # No check that the hat stayed in the rack: the tip is above the gears either way, so the
    # extruder can't tell.
    RESTORE_GCODE_STATE NAME=hat_unload
  {% endif %}

# Tip at the sensor ball: push it to stub_gap above the blade, short of the cut stub, so nothing
# comes out. STUB=1 then pushes the stub out (at load_park_xy if set); STUB=0 leaves it to the
# purge that follows.
[gcode_macro _HAT_LOAD_NOZZLE]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set stub = params.STUB|default(1)|int %}
  {% set to_stub = c.nip_to_cut - c.nip_to_sensor - c.stub_gap %}
  {% if to_stub <= 0 %}
    {action_raise_error("HatChanger: stub_gap too large: the blade is only " ~ (c.nip_to_cut - c.nip_to_sensor) ~ " mm below the sensor")}
  {% endif %}
  _HAT_CHECK_MELT MIN={params.MIN_TEMP|default(c.min_melt_temp)} WHAT="load to the nozzle"
  _HAT_E D={to_stub} SPEED={c.load_speed}
  _HAT_SET_LOADED V=1
  {% if stub %}
    {% if c.load_park_xy|length == 2 %}
  G90
      {% if c.load_park_z > 0 %}
  G1 Z{c.load_park_z} F{c.z_speed * 60}
      {% endif %}
  G1 X{c.load_park_xy[0]} Y{c.load_park_xy[1]} F{c.travel_speed * 60}
    {% endif %}
  _HAT_E D={c.nozzle_to_nip - c.nip_to_cut + c.stub_gap} SPEED={c.load_speed}
  {% endif %}

[gcode_macro HAT_PICKUP]
description: Pick up LANE (docks the hat on the head first, if any); TO_NOZZLE=1 (default) also loads the filament; STUB=0 leaves the cut stub in the nozzle for a purge that follows (default 1: pushed out at load_park_xy). DRY=1: movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if params.LANE is not defined %}
    {action_raise_error("HatChanger: HAT_PICKUP needs LANE=n")}
  {% endif %}
  {% set lane = params.LANE|int %}
  {% set dry = params.DRY|default(0)|int %}
  {% set to_nozzle = 0 if dry else params.TO_NOZZLE|default(1)|int %}
  {% set min_t = params.MIN_TEMP|default(c.min_melt_temp) %}
  {% set stub = params.STUB|default(1)|int %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set cur = st.lane|int %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  {% if lane == cur %}
    {% if to_nozzle and not st.loaded|int %}
  # already on the head, not loaded: bring the tip to the sensor and load
  _HAT_CHECK_READY
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
  SAVE_GCODE_STATE NAME=hat_load
  _HAT_GRAB_CHECK
  _HAT_LOAD_NOZZLE MIN_TEMP={min_t} STUB={stub}
  RESTORE_GCODE_STATE NAME=hat_load
    {% else %}
  RESPOND MSG="HatChanger: hat {lane} is already on the head"
    {% endif %}
  {% else %}
  {% if cur >= 0 %}
  # another hat is on the head: check before moving, then dock it
  _HAT_CHECK_READY DRY={dry}
    {% if to_nozzle %}
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
    {% endif %}
  RESPOND MSG="HatChanger: docking hat {cur} first"
  HAT_DOCK DRY={dry}
  {% endif %}
  {% if dry %}
  _HAT_DRY_CHECK
  {% endif %}
  _HAT_CHECK_READY DRY={dry}
  {% if to_nozzle %}
  # check before moving, not with the hat already on the head
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
  {% endif %}
  {% if not dry %}
  _HAT_PROBE_EMPTY CONTEXT=pickup
  {% endif %}
  SAVE_GCODE_STATE NAME=hat_load
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  _HAT_PICKUP_MOVES LANE={lane} DRY={dry}
  {% if to_nozzle %}
    # the grab check left the tip at the sensor ball
    _HAT_LOAD_NOZZLE MIN_TEMP={min_t} STUB={stub}
  {% endif %}
  RESTORE_GCODE_STATE NAME=hat_load
  {% endif %}

# HAT_START: call it from START_PRINT with the slicer's first tool, after homing, QGL and
# heating, before the start purge. It loads the first lane, so the slicer's first T<n> does
# nothing. No purge here. STUB (default start_stub): 1 = push the cut stub out at load_park_xy,
# 0 = leave it to the start purge. LANE missing or < 0: nothing to do.
[gcode_macro HAT_START]
description: START_PRINT hook: put LANE (the first tool of the print) on the head and load it before the start purge. TEMP=t heats first; STUB=0 leaves the cut stub for the start purge
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(-1)|int %}
  {% set stub = params.STUB|default(c.start_stub)|int %}
  {% if lane < 0 %}
    RESPOND MSG="HatChanger: HAT_START without LANE, nothing to do (add INITIAL_TOOL=[initial_tool] to the slicer's START_PRINT line)"
  {% elif lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: HAT_START LANE=" ~ lane ~ " but only " ~ c.lane_x|length ~ " lanes are configured (lane_x)")}
  {% elif lane == st.lane|int and st.loaded|int %}
    RESPOND MSG="HatChanger: hat {lane} already loaded, no change before the start purge"
  {% else %}
    {% if params.TEMP is defined and printer.extruder.target|float < params.TEMP|float %}
      M109 S{params.TEMP|float}
    {% endif %}
    RESPOND MSG="HatChanger: print starts with lane {lane}, hat on the head: {st.lane if st.lane|int >= 0 else 'none'} - changing before the start purge"
    SAVE_GCODE_STATE NAME=hat_start
    HAT_PICKUP LANE={lane} STUB={stub}
    RESTORE_GCODE_STATE NAME=hat_start
  {% endif %}

[gcode_macro HAT_CHANGE]
description: Full change to LANE (unload, load, purge, return)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|int %}
  # with a purge macro, the purge pushes the cut stub out of the nozzle
  {% set stub = 0 if c.purge_macro else 1 %}
  {% if lane == st.lane|int and st.loaded|int %}
    RESPOND MSG="HatChanger: lane {lane} already loaded"
  {% elif lane == st.lane|int %}
    # on the head but not loaded (e.g. after a test): load and purge, no pickup
    RESPOND MSG="HatChanger: hat {lane} is on the head but not loaded: loading it"
    _HAT_CHECK_READY
    SAVE_GCODE_STATE NAME=hat_change
    _HAT_GRAB_CHECK
    _HAT_LOAD_NOZZLE STUB={stub}
    {% if c.purge_macro %}{c.purge_macro}{% endif %}
    RESTORE_GCODE_STATE NAME=hat_change MOVE=1 MOVE_SPEED={c.travel_speed}
  {% else %}
    SAVE_GCODE_STATE NAME=hat_change
    {% if printer["gcode_macro _HAT_STATE"].lane|int >= 0 %}HAT_DOCK{% endif %}
    HAT_PICKUP LANE={lane} STUB={stub}
    {% if c.purge_macro %}{c.purge_macro}{% endif %}
    RESTORE_GCODE_STATE NAME=hat_change MOVE=1 MOVE_SPEED={c.travel_speed}
  {% endif %}

# What the macros believe, and what the sensor reads.
[gcode_macro HAT_STATUS]
description: Print HatChanger state (hat on the head, loaded, sensor, HAT_CAL_DOCK step)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set seen = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  {% set lane = st.lane|int %}
  {% if lane < 0 %}
    {% set hint = "head empty: the sensor should read empty" ~ (" - it does NOT: a hat or a strand is on the head?" if seen else "") %}
  {% elif st.loaded|int %}
    {% set hint = "loaded to the nozzle: the sensor should read DETECTED" ~ (" - it does NOT: filament snapped or state wrong?" if not seen else "") %}
  {% else %}
    {% set hint = "not loaded: the tip is either at the sensor (after a pickup) or parked above it" %}
  {% endif %}
  RESPOND MSG="HatChanger: hat {lane if lane >= 0 else 'none'} | loaded {st.loaded} | sensor {'DETECTED' if seen else 'empty'} | HAT_CAL_DOCK step {st.align} | {hint}"
  RESPOND MSG="HatChanger: nozzle {printer.extruder.temperature|round(1)}/{printer.extruder.target} C | fix the state with HAT_SET_STATE LANE=.. LOADED=.."

# Hat on the head: walk the dock approach in stages, stopping at each one. Never releases the hat.
#   STEP=1  in front of the rack, rails at slide height (dock_z + lift)
#   STEP=2  slid in to the plate (dock_y_in)
#   STEP=3  lowered onto the lower lips (dock_z - seat_press), where HAT_DOCK releases the hat
#   STEP=0  back out to the loaded travel height
# Going from one step to another only does the moves in between.
[gcode_macro HAT_CAL_DOCK]
description: Hat on the head: stop at dock approach STEP 1/2/3 (3 = docked, 0 = back out) for checking alignment
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.align_lane if st.align|int > 0 else (st.lane if st.lane|int >= 0 else 0))|int %}
  {% set t = params.STEP|default(1)|int %}
  {% set a = st.align|int %}
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  {% set y_pre = c.dock_y_in + s * c.plate_clear %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
    {action_raise_error("HatChanger: run QUAD_GANTRY_LEVEL first (dock Z depends on it)")}
  {% endif %}
  {% if t < 0 or t > 3 %}
    {action_raise_error("HatChanger: STEP must be 0..3")}
  {% endif %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  {% if a == 0 and st.lane|int < 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK needs the hat ON the head (state: head empty). It drives a loaded head into its own EMPTY rack; an empty head would hit the docked hat. Nothing moved. With an empty head use HAT_CAL_PICKUP LANE=" ~ lane)}
  {% endif %}
  {% if a == 0 and lane != st.lane|int %}
    {action_raise_error("HatChanger: hat " ~ st.lane ~ " is on the head, so only rack " ~ st.lane ~ " is empty: HAT_CAL_DOCK LANE=" ~ lane ~ " would hit the hat docked there. Nothing moved")}
  {% endif %}
  {% set p = printer.toolhead.position %}
  {% set in_zone = p.z > c.dock_z - c.z_clear_loaded + 0.5 and
                   ((p.y - c.dock_y_in) * s) < (c.dock_y_front - c.dock_y_in) * s - 0.5 %}
  {% if a == 0 and in_zone %}
    {action_raise_error("HatChanger: the head is at Z" ~ p.z ~ " Y" ~ p.y ~ ", inside a dock zone, but HAT_CAL_DOCK has no record of how it got there (restart?). Nothing moved. Jog it out by hand (Y towards " ~ c.dock_y_front ~ " at a height where the rails clear the lips, then Z down) - do not home with the head in a rack")}
  {% endif %}
  {% if a > 0 and lane != st.align_lane|int %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ a ~ " in rack " ~ st.align_lane ~ ", not " ~ lane ~ ": finish there first (STEP=0 LANE=" ~ st.align_lane ~ ")")}
  {% endif %}
  {% if a == t %}
    RESPOND MSG="HatChanger align: already at STEP={t}, nothing moved"
  {% else %}
  G90
  {% if a == 0 and t > 0 %}
    _HAT_GO_DOCK_FRONT LANE={lane}
    G1 Z{c.dock_z + c.lift} F{c.z_speed * 60}
    {% set a = 1 %}
  {% endif %}
  {% if t >= 2 and a < 2 %}
    G1 Y{y_pre} F{c.plate_speed * 60}
    G1 Y{c.dock_y_in} F{c.plate_speed * 60}
    {% set a = 2 %}
  {% endif %}
  {% if t >= 3 and a < 3 %}
    G1 Z{c.dock_z - c.seat_press} F{c.sync_speed * 60}
    {% set a = 3 %}
  {% endif %}
  {% if t <= 2 and a == 3 %}
    G1 Z{c.dock_z + c.lift} F{c.sync_speed * 60}
    {% set a = 2 %}
  {% endif %}
  {% if t <= 1 and a == 2 %}
    G1 Y{y_pre} F{c.plate_speed * 60}
    G1 Y{c.dock_y_front} F{c.plate_speed * 60}
    {% set a = 1 %}
  {% endif %}
  {% if t == 0 and a == 1 %}
    G1 Z{c.dock_z - c.z_clear_loaded} F{c.z_speed * 60}
    {% set a = 0 %}
  {% endif %}
  M400
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=align VALUE={t}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=align_lane VALUE={lane if t > 0 else -1}
  {% set msg = ["back out, at the loaded travel height",
                "in front of rack " ~ lane ~ ", rails at slide height: check X and the height of the rails vs the lips",
                "slid in to the plate, rails " ~ c.lift ~ " mm above the lower lips: check they clear both lips and the hat is flat against the plate",
                "DOCKED at X" ~ c.lane_x[lane] ~ " Y" ~ c.dock_y_in ~ " Z" ~ (c.dock_z - c.seat_press) ~ ": hat on the lower lips, flat against the plate (magnets ~0.3 mm short), still on the head"][t] %}
  RESPOND MSG="HatChanger align STEP={t}: {msg}"
  {% endif %}

# Empty head, hat in the rack: stop GAP mm (default 5) under the hat. Jog until the hat seats,
# then copy the position into lane_x / dock_y_in / dock_z.
[gcode_macro HAT_CAL_PICKUP]
description: Empty head: stop GAP mm under the docked hat of LANE, for jogging the dock position
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set lane = params.LANE|default(0)|int %}
  {% set gap = params.GAP|default(5)|float %}
  {% if printer["gcode_macro _HAT_STATE"].lane|int >= 0 %}
    {action_raise_error("HatChanger: run this with an EMPTY head (HAT_DOCK first)")}
  {% endif %}
  {% if c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    {action_raise_error("HatChanger: the state says the head is empty, but the sensor sees filament: a hat is on the head? It would hit the docked hat. Nothing moved")}
  {% endif %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  _HAT_CHECK_READY DRY=1
  {% set p = printer.toolhead.position %}
  {% set ze = c.dock_z - c.z_clear %}
  G90
  G1 Z{[p.z, ze]|min} F{c.z_speed * 60}
  G1 X{c.lane_x[lane]} Y{c.dock_y_in} F{c.travel_speed * 60}
  G1 Z{c.dock_z - gap} F{c.approach_speed * 60}
  M400
  RESPOND MSG="HatChanger: lane {lane} at X{c.lane_x[lane]} Y{c.dock_y_in} Z{c.dock_z - gap}. Jog up slowly, check the stinger enters the seat centred."

# Reliability test: pick up and dock LANE COUNT times, without loading the nozzle. A hat on the
# head is docked first. Any failure stops the test. DWELL=s pauses between cycles.
[gcode_macro HAT_TEST_LANE]
description: Dock/undock LANE COUNT times (pickup + drop-off, no nozzle loading), from either state. DRY=1: no filament, movements only
gcode:
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.lane if st.lane|int >= 0 else 0)|int %}
  {% set n = params.COUNT|default(10)|int %}
  {% set dwell = (params.DWELL|default(0)|float * 1000)|int %}
  {% if st.align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ st.align ~ ", run HAT_CAL_DOCK STEP=0 first")}
  {% endif %}
  {% if st.lane|int >= 0 %}
    {% if st.lane|int != lane %}
      {action_raise_error("HatChanger: hat of lane " ~ st.lane ~ " is on the head, not lane " ~ lane)}
    {% endif %}
    RESPOND MSG="HatChanger test: hat on the head, docking it first"
    HAT_DOCK DRY={params.DRY|default(0)|int}
  {% endif %}
  {% for i in range(n) %}
    HAT_PICKUP LANE={lane} TO_NOZZLE=0 DRY={params.DRY|default(0)|int}
    HAT_DOCK CUT=0 DRY={params.DRY|default(0)|int}
    RESPOND MSG="HatChanger test cycle {i + 1}/{n} ok"
    {% if dwell > 0 %}G4 P{dwell}{% endif %}
  {% endfor %}
  RESPOND MSG="HatChanger test: {n} cycles done, hat docked"

# Same as HAT_TEST_LANE over each lane of LANES (default: all) in turn, COUNT rounds.
[gcode_macro HAT_TEST_ALL]
description: Pick up / drop each lane of LANES (default: all) in turn, COUNT rounds, no nozzle loading. DRY=1: no filament, movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set all = range(c.lane_x|length)|list %}
  {% set lanes = (params.LANES.split(',')|map('int')|list) if params.LANES else all %}
  {% set n = params.COUNT|default(5)|int %}
  {% set dwell = (params.DWELL|default(0)|float * 1000)|int %}
  {% for l in lanes %}
    {% if l < 0 or l >= c.lane_x|length %}
      {action_raise_error("HatChanger: lane " ~ l ~ " is not in lane_x")}
    {% endif %}
  {% endfor %}
  {% if st.align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ st.align ~ ", run HAT_CAL_DOCK STEP=0 first")}
  {% endif %}
  {% if st.lane|int >= 0 %}
    RESPOND MSG="HatChanger test: hat {st.lane} on the head, docking it first"
    HAT_DOCK DRY={params.DRY|default(0)|int}
  {% endif %}
  {% for i in range(n) %}
    {% for l in lanes %}
      HAT_PICKUP LANE={l} TO_NOZZLE=0 DRY={params.DRY|default(0)|int}
      HAT_DOCK CUT=0 DRY={params.DRY|default(0)|int}
      RESPOND MSG="HatChanger lane test round {i + 1}/{n}: lane {l} ok"
      {% if dwell > 0 %}G4 P{dwell}{% endif %}
    {% endfor %}
  {% endfor %}
  RESPOND MSG="HatChanger lane test: {n} rounds over lanes {lanes} done, all hats docked"
