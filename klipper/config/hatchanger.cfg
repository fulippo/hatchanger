# =====================================================================================
#  HatChanger v0.29 - filament-cutter variant (Klipper macros)
#
#  Cutter: FilamATrix (blade between two M3 heat-set inserts, ~38 mm below the gear nip,
#  actuated by an arm on the head's -X side pushed against a pin on the gantry). No tip forming.
#
#  No tip-position bookkeeping: every filament move that matters is referenced to the
#  after-gears sensor (D2F + ball, nip_to_sensor below the gear nip), a fixed physical point.
#  The only state is WHICH hat is on the head and WHETHER its filament is loaded to the nozzle.
#
#  Drop-off:  [loaded: cut at the pin, pull the cut end up near the sensor] -> pre-park: move the
#             filament until the sensor clears (from either side), then the fixed
#             (nip_to_sensor - grip_margin) up: tip grip_margin below the nip, still gripped
#             -> go to the rack -> slide into the V-channel to the plate (last plate_clear mm slow)
#             -> set the hat on the lower lips -> SYNCED descent: Z down and E back by the same
#             amount (grip_margin + release_margin), so the filament stays still in the hat while
#             the head magnets let go and the tip slides out of the gears -> Z down, leave.
#  Pickup:    empty-head probe -> the mirror: rise under the hat with Z up and E forward synced
#             for the whole rise, so the gears take the hanging tip wherever it hangs
#             -> lift to mid-channel, slide out -> grab check: push until the sensor
#             sees filament -> [load: the fixed (nip_to_cut - nip_to_sensor - stub_gap) in place,
#             tip just above the stub left by the last cut: nothing comes out. The stub itself
#             (nozzle_to_nip - nip_to_cut) is pushed out by the purge macro, or, without one, at
#             load_park_xy].
#
#  Commands (public macros):
#    Use:        HAT_CHANGE LANE=n    full change: dock the current hat, pick up n, load, purge, return
#                T0 / T1              = HAT_CHANGE LANE=0 / 1 (what the slicer calls). In
#                                     hatchanger_tools.cfg: include it WITHOUT AFC only (with AFC,
#                                     AFC owns the T commands: hatchanger_afc.cfg)
#                HAT_START LANE=n     START_PRINT hook: right hat on the head + loaded BEFORE the start
#                                     purge, so the slicer's first T<n> is a no-op (with AFC too)
#                HAT_PICKUP LANE=n    pick up hat n (docks the current hat first; TO_NOZZLE=0: don't load;
#                                     STUB=0: leave the cut stub in the nozzle for your own purge)
#                HAT_DOCK             cut if needed, put the hat on the head back in its rack
#                HAT_CUT              press the cutter once (cut_count presses) and come back
#    State:      HAT_STATUS           what the macros believe + what the sensor reads
#                HAT_SET_STATE LANE=n|-1 LOADED=0|1   fix the state after moving a hat by hand
#    Calibrate:  HAT_CAL_DOCK LANE=n STEP=1..4|0   hat ON the head: walk into its empty rack step by step
#                HAT_CAL_PICKUP LANE=n GAP=5       EMPTY head: stop under the docked hat, then jog up
#    Test:       HAT_TEST_LANE LANE=n COUNT=10     pick up / dock one lane repeatedly (no nozzle loading)
#                HAT_TEST_ALL COUNT=5 [LANES=1,0]  same, every lane in turn
#    (hatchanger_id.cfg: HAT_ID, HAT_ID_CHECK LANE=n)
#
#  v0 limitations: failures raise an error (aborts a running print); no retry logic.
#  Requires [save_variables] (reuse yours if you already have one) and the sensor.
#  With AFC (Armored Turtle): hatchanger_afc.cfg + klipper/extras/AFC_HatChanger.py, see docs/AFC.md.
#  Moves with no XY are "extrude-only" for Klipper: E moves are chunked to <= 40 mm,
#  and the synced Z+E move is limited by max_extrude_only_velocity.
# =====================================================================================

[save_variables]
filename: ~/printer_data/config/hatchanger_vars.cfg

# After-gears filament sensor in front_body_hatchanger (FilamATrix's: D2F + 5.5 mm ball on the +X
# side, 19.85 mm below the gear nip). pause_on_runout is off: HatChanger checks the sensor itself.
# Wiring the D2F: COM -> GND, NC -> signal (tested): filament present = switch open = pin high
# through the pull-up, so no '!'. With NO -> signal instead it reads backwards: add '!'.
# BTT SB2209 USB (RP2040): 'Endstop' port = GPIO13 (5V / GND / GPIO13) if your X endstop isn't
#   on it; otherwise the 'I2C' port (5V / GND / SCL GPIO29 / SDA GPIO28), signal on GPIO29.
# Use your own [mcu ...] name in place of EBB.
[filament_switch_sensor hat_toolhead]
switch_pin: ^EBB:gpio13      # SB2209 USB 'Endstop' port. 'EBB' = the name of your toolboard [mcu ...] section
pause_on_runout: False

[gcode_macro _HAT_CFG]
# ---- filament path (MEASURE) ---------------------------------------------------------
variable_nozzle_to_nip: 81.1        # gear nip -> nozzle along the filament (prototype: 81.1; RE-MEASURE with
                                    #   the FilamATrix printhead). Only used to push the cut stub out of the
                                    #   nozzle (stub = this - nip_to_cut = ~43 mm) when no purge macro follows
variable_grip_margin: 3.0           # pre-park: tip this far below the nip (still gripped). Also the
                                    #   docked hang: ~10 mm (nip -> stinger end) + this, bare filament
variable_nip_to_sensor: 19.85       # gear nip -> sensor ball (front_body_hatchanger v0.29, FilamATrix sensor)
variable_nip_to_cut: 38.35          # gear nip -> blade (FilamATrix: cut at z ~61.9 in the G2E frame)
variable_sensor_margin: 3.0         # grab check: extra push allowed beyond the expected distance to the ball
variable_release_margin: 10.0       # synced descent goes this far past the nip. Free: Z and E move together,
                                    #   so the filament stays still in the hat. Covers a long, tapered tip
                                    #   (the sensor only switches on the full diameter, up to ~10 mm late)
variable_sync_extra: 8.0            # pickup: the slow final stretch starts this much before the expected engage
                                    #   point (the gears turn for the whole rise anyway)
# ---- dock (CALIBRATE after mounting) -------------------------------------------------
variable_lane_x: [35.5, 105.0]      # one X per installed rack (both measured on the prototype). When adding racks, keep
                                    #   >= ~40 mm between them (45 is comfortable): the head body (+-32.6)
                                    #   must pass beside the neighbours' hanging stingers while it rises
                                    #   in front of its own rack. Without AFC, add a T<n> macro in
                                    #   hatchanger_tools.cfg for each new lane (with AFC: an [AFC_lane]).
variable_dock_y_in: 7.0             # measured on the prototype: hat against the rack plate (HAT_CAL_DOCK STEP=2/3)
                                    #   (with hat_rack_spacer_<L>: re-measure, the rack moves L mm in +Y)
variable_dock_y_front: 33.3         # approach Y = dock_y_in + cart_d (18) + 8. Racks on the FRONT
                                    #   extrusion: the open side faces +Y, so this is higher than dock_y_in
variable_seat_press: 0.4            # at the dock the head always goes this far BELOW dock_z: the hat then surely
                                    #   rests on the lower lips (the V centres it in X and Z) and the head never
                                    #   pushes it against the upper lips. The dowels (3.8 mm) and
                                    #   magnets keep the hat on the head across the gap. dock_z may be up to
                                    #   this much too high and still dock.
variable_plate_clear: 4.0           # last mm of the slide in (and first mm out) run at plate_speed: the hat meets
                                    #   the plate gently and the snap magnets break away slowly (no dock pin since v0.32)
variable_plate_speed: 5             # mm/s for those plate_clear mm
variable_lift: 0.6                  # = P.lift in hatchanger_cad.py: rails clear the lips by this. v0.31 racks
                                    #   have an upper lip 1.2 mm above the seat: keep this <= ~0.8 (0.6 = mid-channel)
variable_dock_z: 244.5              # Z where the rails JUST touch the lips with the hat fully seated on the head (prototype: 244.5)
                                    #   (HAT_CAL_DOCK STEP=3, then jog down 0.1 at a time until they touch).
                                    #   The macros go seat_press below it. Needs position_max Z >= dock_z + lift
variable_z_clear: 42.0              # EMPTY head: docked hang = 20.5 stinger + ~10 + grip_margin bare = ~33.5,
                                    #   + 3.8 dowels + ~6 margin
variable_z_clear_loaded: 72.0       # LOADED head: z_clear + 16 hat + ~4 ECAS + bowden bend + margin
                                    #   -> a loaded head can't go above Z 177: max print height ~175 mm
# ---- speeds (mm/s) -------------------------------------------------------------------
variable_travel_speed: 250
variable_z_speed: 20
variable_slide_speed: 15
variable_sync_speed: 5
variable_approach_len: 15.0         # pickup: the last mm of the rise before the sync move are slow, while
variable_approach_speed: 5          #   the hanging tip travels down the seat into the gears' lead-in
variable_probe_empty: True          # before every pickup, push the extruder probe_len forward and read the
variable_probe_len: 40.0            #   sensor: if a hat whose filament is IN THE GEARS is on the head, the filament
                                    #   reaches the sensor -> retract back and stop, nothing moved. It can't see a
                                    #   hat whose tip is above the gears. ~5 s; the tip stays far from the melt zone
variable_seek_step: 1.0             # sensor seeks (pre-park, grab check): steps this long...
variable_seek_max: 45.0             #   ...for at most this far (more = gears skipping / filament stuck)
variable_park_speed: 8              # pre-park retract (tip up to just below the gears). Slow: the filament
                                    #   drags on the bowden through the hat, and a fast pull can lift the
                                    #   hat off the head magnets (then the gears skip)
variable_load_speed: 15
variable_stub_gap: 2.0              # loading stops this far ABOVE the blade, short of the cut stub: the new
                                    #   filament doesn't touch it, so nothing is pushed out of the nozzle in place
variable_load_park_xy: []           # [x, y]: where the head goes to push the cut stub out of the nozzle when
                                    #   NO purge macro follows (HAT_PICKUP on its own, or purge_macro ''),
                                    #   e.g. over the purge bucket / off the bed. [] = push where the head is
variable_load_park_z: 0             # Z for that park; 0 = keep the current Z (the pickup leaves the head at the
                                    #   loaded travel height, dock_z - z_clear_loaded, above any print)
# ---- cutter (FilamATrix arm + gantry pin, CALIBRATE) --------------------------------------
# Jog the head towards the pin (FilamATrix: the arm is on the -X side, so the head moves towards -X):
# cut_x_touch = X where the arm just touches the pin, cut_x_cut = X where the arm is fully pressed
# (blade through the filament; stop before anything else touches). cut_y = Y of the pin line.
variable_cut_x_touch: 16.0          # arm just touches the pin (0 / 0 = not calibrated: HAT_DOCK refuses to unload a loaded hat)
variable_cut_x_cut: 10.0            # tested: cuts without skipping (X7 and below skipped on the first press)
variable_cut_y: 77.0
variable_cut_approach: 5.0          # start the press this far before cut_x_touch
variable_cut_z_hop: 2.0             # lift Z this much before travelling to the pin, so the nozzle clears the
                                    #   print (capped at the loaded travel height). The pin is on the gantry: any Z works
variable_cut_fast_speed: 150        # mm/s to the start point
variable_cut_press_speed: 20        # mm/s for the first press_fast_fraction of the press (approach + arm contact)
variable_cut_press_fast_fraction: 0.4   # fast part ends at ~X16.6, just before the arm touches the pin (X16)
variable_cut_slow_speed: 5          # mm/s for the rest: spring + blade through the filament (skipped steps at 30)
variable_cut_dwell: 0.2             # s, arm fully pressed
variable_cut_count: 2               # presses (the 2nd finishes a partial cut)
variable_cut_pull: 3.0              # after the cut the filament is pulled up to this far below the sensor
                                    #   at park_speed (also tears a partial cut), then pre-park seeks
# ---- melt-temperature guard ----------------------------------------------------------
variable_min_melt_temp: 190         # lowest nozzle temp that melts every filament you load (PLA ~190).
                                    #   Loading to the nozzle pushes the cut stub through the melt zone, so it
                                    #   needs a hot nozzle. HAT_PICKUP accepts MIN_TEMP=... to override it once.
                                    #   Unloading only cuts (cold) and pulls the filament up above the cut.
variable_melt_temp_tolerance: 5     # actual may be this far under the target before we wait for it
# ---- hooks ---------------------------------------------------------------------------
variable_purge_macro: 'BLOBIFIER'   # run after HAT_PICKUP in HAT_CHANGE. It ALSO pushes out the cut stub (~43 mm
                                    #   of old filament, nozzle_to_nip - nip_to_cut): purge at least that much
                                    #   more than the colour change alone needs. '' = no purge: the stub is pushed
                                    #   out at load_park_xy
variable_start_stub: 1             # HAT_START (START_PRINT hook): 1 = push the cut stub out at load_park_xy
                                    #   before the start purge; 0 = leave it to the start purge (only if
                                    #   that purges well over 45 mm, e.g. BLOBIFIER)
variable_sensor: 'hat_toolhead'     # after-gears D2F (required: every filament move is referenced to it)
gcode:

[gcode_macro _HAT_STATE]
variable_lane: -1                   # hat on the head, -1 = none
variable_loaded: 0                  # 1 = its filament is loaded to the nozzle
variable_seek_done: 0
variable_seek_moved: 0.0
variable_align: 0
variable_align_lane: -1
variable_probe_hit: 0
gcode:

[delayed_gcode _HAT_RESTORE_STATE]
initial_duration: 1
gcode:
  {% set sv = printer.save_variables.variables %}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=lane VALUE={sv.hat_lane|default(-1)}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=loaded VALUE={sv.hat_loaded|default(0)}

# Every state change also runs _HAT_CFG state_hook, if set (hatchanger_afc.cfg sets it so AFC
# follows hats moved with the HatChanger commands). Not a variable in _HAT_CFG on purpose: a
# second [gcode_macro _HAT_CFG] section in another file can add it whatever the include order.
[gcode_macro _HAT_SET_LANE]
gcode:
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=lane VALUE={params.LANE|int}
  SAVE_VARIABLE VARIABLE=hat_lane VALUE={params.LANE|int}
  {% set hook = printer["gcode_macro _HAT_CFG"].state_hook|default('') %}
  {% if hook %}{hook}{% endif %}

[gcode_macro _HAT_SET_LOADED]
gcode:
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=loaded VALUE={params.V|int}
  SAVE_VARIABLE VARIABLE=hat_loaded VALUE={params.V|int}
  {% set hook = printer["gcode_macro _HAT_CFG"].state_hook|default('') %}
  {% if hook %}{hook}{% endif %}

# Manual fix of the state, e.g. after moving a hat by hand: LANE=-1|n, LOADED=0|1. Nothing moves.
[gcode_macro HAT_SET_STATE]
description: Tell HatChanger which hat is on the head (LANE, -1 = none) and whether it is loaded to the nozzle (LOADED)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.lane)|int %}
  {% set loaded = params.LOADED|default(st.loaded if lane >= 0 else 0)|int %}
  {% if lane < -1 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: LANE must be -1 (head empty) or 0.." ~ (c.lane_x|length - 1))}
  {% endif %}
  {% set seen = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  _HAT_SET_LANE LANE={lane}
  _HAT_SET_LOADED V={loaded if lane >= 0 else 0}
  RESPOND MSG="HatChanger: state set to lane {lane}, loaded {loaded if lane >= 0 else 0}"
  {% if lane < 0 and seen %}
    RESPOND TYPE=error MSG="HatChanger: WARNING the sensor sees filament, but you set the head EMPTY. A hat or a strand is on the head?"
  {% elif lane >= 0 and loaded and not seen %}
    RESPOND TYPE=error MSG="HatChanger: WARNING you set the hat LOADED, but the sensor sees no filament"
  {% endif %}

[gcode_macro _HAT_CHECK_READY]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
    {action_raise_error("HatChanger: run QUAD_GANTRY_LEVEL first (dock Z depends on it)")}
  {% endif %}
  {% if printer["gcode_macro _HAT_STATE"].align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ printer["gcode_macro _HAT_STATE"].align ~ " (head in a rack): run HAT_CAL_DOCK STEP=0 first. Nothing moved")}
  {% endif %}
  {% if not params.DRY|default(0)|int %}
    {% if not c.sensor %}
      {action_raise_error("HatChanger: the after-gears sensor is required (variable_sensor)")}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
      {action_raise_error("HatChanger: extruder too cold to move filament")}
    {% endif %}
  {% endif %}

# Relative extruder move D mm (+ = down towards the nozzle), chunked to <= 40 mm.
[gcode_macro _HAT_E]
gcode:
  {% set d = params.D|float %}
  {% set f = params.SPEED|float * 60 %}
  {% set n = ((d|abs) / 40.0)|round(0, 'ceil')|int %}
  M83
  {% for i in range(n) %}
    G1 E{d / n} F{f}
  {% endfor %}
  M400

# Cut the filament with the FilamATrix arm: lift cut_z_hop, move in front of the pin, press the arm
# against it cut_count times, come back. Filament untouched (the gears hold it). Works cold.
[gcode_macro _HAT_CUT_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if c.cut_x_touch == c.cut_x_cut %}
    {action_raise_error("HatChanger: the cutter is not calibrated (cut_x_touch / cut_x_cut / cut_y in _HAT_CFG)")}
  {% endif %}
  {% set s = 1 if c.cut_x_cut > c.cut_x_touch else -1 %}
  {% set x0 = c.cut_x_touch - s * c.cut_approach %}
  {% set xf = x0 + (c.cut_x_cut - x0) * c.cut_press_fast_fraction %}
  {% set p = printer.gcode_move.gcode_position %}
  {% set zt = c.dock_z - c.z_clear_loaded %}
  G90
  G1 Z{[p.z + c.cut_z_hop, [p.z, zt]|max]|min} F{c.z_speed * 60}
  G1 X{x0} Y{c.cut_y} F{c.cut_fast_speed * 60}
  {% for i in range(c.cut_count|int) %}
    G1 X{xf} F{c.cut_press_speed * 60}
    G1 X{c.cut_x_cut} F{c.cut_slow_speed * 60}
    G4 P{(c.cut_dwell * 1000)|int}
    G1 X{x0} F{c.cut_press_speed * 60}
  {% endfor %}
  M400

# Public: cut once (for calibrating the pin position; a loaded hat stays loaded above the cut).
[gcode_macro HAT_CUT]
description: Press the FilamATrix arm against the pin (cut_count times) and come back
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer["gcode_macro _HAT_STATE"].align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ printer["gcode_macro _HAT_STATE"].align ~ " (head in a rack): run HAT_CAL_DOCK STEP=0 first. Nothing moved")}
  {% endif %}
  SAVE_GCODE_STATE NAME=hat_cut
  _HAT_CUT_MOVES
  RESTORE_GCODE_STATE NAME=hat_cut MOVE=1

# Melt-temperature guard. The target must be >= MIN (else error: never push filament (and the cut
# stub) into a nozzle that can't melt it). If the target is fine but the nozzle hasn't reached it yet,
# wait for it. Rendered when called, so it sees the current temperatures.
[gcode_macro _HAT_CHECK_MELT]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set min_t = params.MIN|default(c.min_melt_temp)|float %}
  {% set what = params.WHAT|default("filament move") %}
  {% set target = printer.extruder.target|float %}
  {% set temp = printer.extruder.temperature|float %}
  {% if target < min_t %}
    {action_raise_error("HatChanger: " ~ what ~ " needs the nozzle at >= " ~ min_t ~ " C to melt the filament, target is " ~ target ~ " C. Set the temperature first (M109 S...)")}
  {% endif %}
  {% if temp < target - c.melt_temp_tolerance %}
    RESPOND MSG="HatChanger: waiting for the nozzle to reach {target} C before the {what}"
    M109 S{target}
  {% endif %}

# ---- pre-park, referenced to the sensor ---------------------------------------------
# Retract in seek_step steps until the after-gears sensor clears (the tip is then at the
# ball, a fixed point 'nip_to_sensor' below the gears), then retract the fixed distance to
# the pre-park point. Independent of the tip accounting, and it resyncs it every time.
# Without a sensor it falls back to the accounting (move to nozzle_to_nip - grip_margin).
# ---- sensor seek -----------------------------------------------------------------------
# Move the filament in seek_step steps until the sensor reads WANT (0 = clear: retract,
# 1 = filament: push), for at most MAX mm; then raise WHAT if it never got there. Each step is
# its own macro, so it reads the sensor after the previous move.
[gcode_macro _HAT_SEEK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set max = params.MAX|default(c.seek_max)|float %}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_done VALUE=0
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_moved VALUE=0.0
  {% for i in range((max / c.seek_step)|round(0, 'ceil')|int) %}
    _HAT_SEEK_STEP WANT={params.WANT|int}
  {% endfor %}
  _HAT_SEEK_END WANT={params.WANT|int} WHAT="{params.WHAT|default('sensor seek failed')}"

[gcode_macro _HAT_SEEK_STEP]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set want = params.WANT|int %}
  {% if st.seek_done|int == 0 %}
    {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected == (want == 1) %}
      SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_done VALUE=1
    {% else %}
      M83
      G1 E{c.seek_step if want == 1 else -c.seek_step} F{c.park_speed * 60}
      M400
      G4 P60
      SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=seek_moved VALUE={st.seek_moved|float + c.seek_step}
    {% endif %}
  {% endif %}

[gcode_macro _HAT_SEEK_END]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set ok = printer["filament_switch_sensor " ~ c.sensor].filament_detected == (params.WANT|int == 1) %}
  {% if not ok %}
    {action_raise_error("HatChanger: " ~ params.WHAT ~ " (moved " ~ st.seek_moved ~ " mm)")}
  {% endif %}

# Pre-park: bring the tip to grip_margin below the nip, referenced to the sensor from either side.
[gcode_macro _HAT_PREPARK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if not printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    # tip above the ball: push it down to the ball first (only works if it is in the gears)
    _HAT_SEEK WANT=1 MAX={c.nip_to_sensor + 5} WHAT="pre-park: pushing does not bring filament to the sensor: the tip is not in the gears (above them, or snapped). Push the filament down by hand (through the bowden) until HAT_STATUS shows the sensor DETECTED, then run HAT_DOCK again"
  {% endif %}
  _HAT_SEEK WANT=0 WHAT="pre-park: the sensor still sees filament: the gears are skipping (filament stuck in the bowden / hat lifted?), a strand snapped below the gears, or the last cut did not go through (check the blade and cut_x_cut)"
  _HAT_E D=-{c.nip_to_sensor - c.grip_margin} SPEED={c.park_speed}

# Grab check after a pickup: push until the sensor sees filament. Expected ~nip_to_sensor -
# (grip_margin - seat_press) mm; allows a long tapered tip and sensor_margin on top.
# The synced rise takes a low-hanging tip further down, possibly past the sensor: then pull it
# back until the sensor clears first, so the tip always ends exactly at the ball (the load to
# the nozzle is a fixed distance from there). Call it after an M400 (reads the sensor).
[gcode_macro _HAT_GRAB_CHECK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    _HAT_SEEK WANT=0 WHAT="pickup: the filament is past the sensor and pulling back does not clear it: the gears are skipping (filament stuck in the bowden / hat lifted?)"
  {% endif %}
  _HAT_SEEK WANT=1 MAX={c.nip_to_sensor + c.sensor_margin + 15} WHAT="pickup: no filament reached the sensor: the grab failed (tip not taken by the gears). The state now says this hat is ON the head. Check by hand: if it is on the head, push its filament down by hand until HAT_STATUS shows the sensor DETECTED, then HAT_DOCK; if it stayed in the rack, HAT_SET_STATE LANE=-1"

# ---- "is the head really empty?" probe (before a pickup) ------------------------------
# Push probe_len forward, read the sensor, ALWAYS retract the same amount, then judge. With an
# empty head the gears spin on nothing; with a hat on the head whose filament is in the gears,
# it is pushed past the sensor. A tip ABOVE the gears is not grabbed, so that case is invisible
# (the gears only move filament that is between them).
[gcode_macro _HAT_PROBE_EMPTY]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set ctx = params.CONTEXT|default("pickup") %}
  {% if c.sensor and c.probe_empty %}
    {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
      {action_raise_error("HatChanger: (" ~ ctx ~ ") the sensor already sees filament with no hat expected on the head: a hat is on it, or a strand is stuck below the gears. Check by hand, fix the state with HAT_SET_STATE")}
    {% endif %}
    {% set dist = [c.probe_len, params.DIST|default(0)|float]|max %}
    {% set k = (dist / 40.0)|round(0, 'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=probe_hit VALUE=0
    M83
    {% for i in range(k) %}
      G1 E{dist / k} F{c.load_speed * 60}
    {% endfor %}
    M400
    G4 P80
    _HAT_PROBE_READ
    {% for i in range(k) %}
      G1 E-{dist / k} F{c.load_speed * 60}
    {% endfor %}
    M400
    _HAT_PROBE_JUDGE CONTEXT={ctx} LANE={params.LANE|default(-1)}
  {% endif %}

[gcode_macro _HAT_PROBE_READ]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=probe_hit VALUE=1
  {% endif %}

[gcode_macro _HAT_PROBE_JUDGE]
gcode:
  {% set hit = printer["gcode_macro _HAT_STATE"].probe_hit|int %}
  {% set lane = params.LANE|default(-1)|int %}
  {% if hit and params.CONTEXT == "dropoff" %}
    _HAT_SET_LANE LANE={lane}
    _HAT_PROBE_FAIL MSG="after the drop-off the head still carries a hat (filament grabbed by the probe): hat {lane} did not stay in its rack. State set back to hat {lane} on the head."
  {% elif hit %}
    _HAT_PROBE_FAIL MSG="before the pickup the probe grabbed filament: a hat is already on the head although the state says it is empty. Nothing moved. Dock it (or remove it by hand) and fix the state with HAT_SET_STATE LANE=<n>."
  {% endif %}

[gcode_macro _HAT_PROBE_FAIL]
gcode:
  {action_raise_error("HatChanger: " ~ params.MSG)}

# DRY runs move the head exactly as usual but never turn the extruder, so the filament must not
# be in the gears (the head would drag it). The sensor can only see filament below the ball, so
# this refuses what it can see; the rest is up to you (pull the filament out of the hats).
[gcode_macro _HAT_DRY_CHECK]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% if c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    {action_raise_error("HatChanger DRY: the sensor sees filament: pull it back above the gears (out of the hats) first")}
  {% endif %}
  {% if st.lane|int >= 0 and st.loaded|int %}
    {action_raise_error("HatChanger DRY: hat " ~ st.lane ~ " is loaded to the nozzle: unload it with HAT_DOCK first")}
  {% endif %}

# Loaded head -> in front of its (empty) dock slot, at loaded travel height
[gcode_macro _HAT_GO_DOCK_FRONT]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set x = c.lane_x[params.LANE|int] %}
  {% set p = printer.toolhead.position %}
  {% set zt = c.dock_z - c.z_clear_loaded %}
  {% if p.z > zt + 0.01 %}
    {action_raise_error("HatChanger: head is above the loaded travel height - print too tall for the dock zone")}
  {% endif %}
  G90
  G1 Z{[p.z + 1.0, zt]|min} F{c.z_speed * 60}
  {% if c.dock_y_in > c.dock_y_front %}
  G1 Y{[p.y, c.dock_y_front]|min} F{c.travel_speed * 60}
  {% else %}
  G1 Y{[p.y, c.dock_y_front]|max} F{c.travel_speed * 60}
  {% endif %}
  G1 Z{zt} F{c.z_speed * 60}
  G1 X{x} Y{c.dock_y_front} F{c.travel_speed * 60}

[gcode_macro _HAT_DOCK_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set rel = params.RELEASE|default(c.release_margin)|float %}
  {% set dry = params.DRY|default(0)|int %}
  {% set d = c.grip_margin + rel %}
  G90
  # slide into the V-channel with the rails `lift` mm above the lower lips (mid-channel: nothing
  # touches), the last plate_clear mm slowly up to the plate
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  {% set y_pre = c.dock_y_in + s * c.plate_clear %}
  G1 Z{c.dock_z + c.lift} F{c.z_speed * 60}
  G1 Y{y_pre} F{c.slide_speed * 60}
  G1 Y{c.dock_y_in} F{c.plate_speed * 60}
  # set the hat down on the lower lips (the V centres it in X and Z)
  {% set zd = c.dock_z - c.seat_press %}
  G1 Z{zd} F{c.sync_speed * 60}
  M400
  # synced descent: Z down and E back by the same distance, so the filament stays still in
  # the hat while the head magnets let go and the tip slides up out of the gears
  {% if dry %}
  G1 Z{zd - d} F{c.sync_speed * 60}
  {% else %}
  M83
  G1 Z{zd - d} E-{d} F{c.sync_speed * 60}
  {% endif %}
  G1 Z{c.dock_z - c.z_clear} F{c.z_speed * 60}
  _HAT_SET_LANE LANE=-1
  _HAT_SET_LOADED V=0

[gcode_macro _HAT_PICKUP_MOVES]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set lane = params.LANE|int %}
  {% set x = c.lane_x[lane] %}
  {% set p = printer.toolhead.position %}
  {% set ze = c.dock_z - c.z_clear %}
  {% set dry = params.DRY|default(0)|int %}
  {% if p.z > ze + 0.01 %}
    {action_raise_error("HatChanger: empty head above its safe travel height")}
  {% endif %}
  G90
  G1 Z{ze} F{c.z_speed * 60}
  G1 X{x} Y{c.dock_y_in} F{c.travel_speed * 60}
  # The WHOLE rise is synced: Z up and E forward by the same amount, so the gear teeth stand
  # still relative to the frame (like the docked tip) and take the tip wherever it hangs, at
  # zero relative speed. With no filament between them they just spin. Speeds only matter for
  # the mechanics: slow over the last approach_len + sync_extra mm, while the tip runs down the
  # seat into the gears' lead-in. Ends seat_press below dock_z: the head doesn't push the
  # hat against the upper lips; it seats when lifting.
  {% set zs = c.dock_z - c.grip_margin - c.sync_extra %}
  {% set zf = c.dock_z - c.seat_press %}
  {% set e = 0 if dry else 1 %}
  M83
  G1 Z{zs - c.approach_len} E{e * (zs - c.approach_len - ze)} F{c.z_speed * 60}
  G1 Z{zs} E{e * c.approach_len} F{c.approach_speed * 60}
  G1 Z{zf} E{e * (zf - zs)} F{c.sync_speed * 60}
  # lift the hat to mid-channel (off the lower lips, clear of the upper ones), break the rack
  # snap magnets slowly, then slide out
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  G1 Z{c.dock_z + c.lift} F{c.sync_speed * 60}
  G1 Y{c.dock_y_in + s * c.plate_clear} F{c.plate_speed * 60}
  G1 Y{c.dock_y_front} F{c.slide_speed * 60}
  G1 Z{c.dock_z - c.z_clear_loaded} F{c.z_speed * 60}
  _HAT_SET_LANE LANE={lane}
  _HAT_SET_LOADED V=0
  M400
  {% if not dry %}
    _HAT_GRAB_CHECK
  {% endif %}

# ------------------------------------------------------------------ user commands ----

# HAT_DOCK: cuts only when the sensor sees filament (the blade is below the sensor: with the sensor
# clear there is nothing to cut), then pre-parks on the sensor and docks. Cuts even if the state says
# "not loaded" (filament pushed to the nozzle by hand; a cut above an unloaded tip is harmless) unless
# CUT=0, which is refused for a loaded hat. DRY=1: movements only, no filament.
[gcode_macro HAT_DOCK]
description: Park the hat on the head in its rack (cuts the filament first if loaded). RELEASE=mm overrides release_margin. DRY=1: movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = st.lane|int %}
  {% set dry = params.DRY|default(0)|int %}
  {% set loaded = st.loaded|int %}
  {% set sensed = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  {% set cut = not dry and sensed and (loaded or params.CUT|default(1)|int) %}
  {% if lane < 0 %}
    RESPOND MSG="HatChanger: no hat on the head"
  {% else %}
    {% if dry %}
      _HAT_DRY_CHECK
    {% elif loaded and params.CUT|default(1)|int == 0 %}
      {action_raise_error("HatChanger: hat " ~ lane ~ " is loaded to the nozzle, it must be cut: run HAT_DOCK without CUT=0")}
    {% endif %}
    _HAT_CHECK_READY DRY={dry}
    SAVE_GCODE_STATE NAME=hat_unload
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    {% if cut %}
      _HAT_CUT_MOVES
      {% if loaded %}
      # the cut end is nip_to_cut below the gears: bring it up to cut_pull below the sensor fast,
      # the seek in the pre-park does the rest
      _HAT_E D=-{c.nip_to_cut - c.nip_to_sensor - c.cut_pull} SPEED={c.park_speed}
      {% endif %}
    {% endif %}
    {% if not dry %}
      _HAT_PREPARK
      _HAT_SET_LOADED V=0
    {% endif %}
    _HAT_GO_DOCK_FRONT LANE={lane}
    _HAT_DOCK_MOVES RELEASE={params.RELEASE|default(c.release_margin)} DRY={dry}
    # NOTE: no check that the hat stayed in the rack. After the synced descent the tip is above the
    # gears whether the hat stayed or came down with the head, so the extruder can't tell the two
    # apart. Only a hat-presence/ID sensor can (planned: resistor ID through the magnets).
    RESTORE_GCODE_STATE NAME=hat_unload
  {% endif %}

# Tip at the sensor ball (after a pickup) -> push it to stub_gap above the blade, short of the stub
# the last cut left in the hotend: nothing comes out of the nozzle. STUB=1 then also pushes the stub
# out of the nozzle (at load_park_xy if set); STUB=0 leaves that to the purge macro that follows.
[gcode_macro _HAT_LOAD_NOZZLE]
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set stub = params.STUB|default(1)|int %}
  {% set to_stub = c.nip_to_cut - c.nip_to_sensor - c.stub_gap %}
  {% if to_stub <= 0 %}
    {action_raise_error("HatChanger: stub_gap too large: the blade is only " ~ (c.nip_to_cut - c.nip_to_sensor) ~ " mm below the sensor")}
  {% endif %}
  _HAT_CHECK_MELT MIN={params.MIN_TEMP|default(c.min_melt_temp)} WHAT="load to the nozzle"
  _HAT_E D={to_stub} SPEED={c.load_speed}
  _HAT_SET_LOADED V=1
  {% if stub %}
    {% if c.load_park_xy|length == 2 %}
  G90
      {% if c.load_park_z > 0 %}
  G1 Z{c.load_park_z} F{c.z_speed * 60}
      {% endif %}
  G1 X{c.load_park_xy[0]} Y{c.load_park_xy[1]} F{c.travel_speed * 60}
    {% endif %}
  _HAT_E D={c.nozzle_to_nip - c.nip_to_cut + c.stub_gap} SPEED={c.load_speed}
  {% endif %}

[gcode_macro HAT_PICKUP]
description: Pick up LANE (docks the hat on the head first, if any); TO_NOZZLE=1 (default) also loads the filament; STUB=0 leaves the cut stub in the nozzle for a purge that follows (default 1: pushed out at load_park_xy). DRY=1: movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% if params.LANE is not defined %}
    {action_raise_error("HatChanger: HAT_PICKUP needs LANE=n")}
  {% endif %}
  {% set lane = params.LANE|int %}
  {% set dry = params.DRY|default(0)|int %}
  {% set to_nozzle = 0 if dry else params.TO_NOZZLE|default(1)|int %}
  {% set min_t = params.MIN_TEMP|default(c.min_melt_temp) %}
  {% set stub = params.STUB|default(1)|int %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set cur = st.lane|int %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  {% if lane == cur %}
    {% if to_nozzle and not st.loaded|int %}
  # its hat is already on the head, not loaded: bring the tip to the sensor and load (no pickup)
  _HAT_CHECK_READY
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
  SAVE_GCODE_STATE NAME=hat_load
  _HAT_GRAB_CHECK
  _HAT_LOAD_NOZZLE MIN_TEMP={min_t} STUB={stub}
  RESTORE_GCODE_STATE NAME=hat_load
    {% else %}
  RESPOND MSG="HatChanger: hat {lane} is already on the head"
    {% endif %}
  {% else %}
  {% if cur >= 0 %}
  # another hat is on the head: check what can fail before moving, then dock it
  _HAT_CHECK_READY DRY={dry}
    {% if to_nozzle %}
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
    {% endif %}
  RESPOND MSG="HatChanger: docking hat {cur} first"
  HAT_DOCK DRY={dry}
  {% endif %}
  {% if dry %}
  _HAT_DRY_CHECK
  {% endif %}
  _HAT_CHECK_READY DRY={dry}
  {% if to_nozzle %}
  # before moving: a cold nozzle would otherwise stop us with the hat already on the head
  _HAT_CHECK_MELT MIN={min_t} WHAT="load to the nozzle"
  {% endif %}
  {% if not dry %}
  _HAT_PROBE_EMPTY CONTEXT=pickup
  {% endif %}
  SAVE_GCODE_STATE NAME=hat_load
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  _HAT_PICKUP_MOVES LANE={lane} DRY={dry}
  {% if to_nozzle %}
    # the grab check left the filament at the sensor ball: the rest is a fixed distance
    _HAT_LOAD_NOZZLE MIN_TEMP={min_t} STUB={stub}
  {% endif %}
  RESTORE_GCODE_STATE NAME=hat_load
  {% endif %}

# HAT_START: call it from START_PRINT with the slicer's first tool, AFTER homing / QGL / mesh and
# with the nozzle at print temperature, BEFORE the start purge (line purge, BLOBIFIER, ...).
# It puts the right hat on the head and loads it, so the start purge is done with the filament
# the print actually begins with. When the slicer then sends its first T<n>, HAT_CHANGE finds that
# lane already loaded and does nothing: no second change, no second purge.
#   - right hat on the head and loaded: nothing moves
#   - right hat on the head, not loaded: loads it
#   - other hat / no hat: docks the current one (cut, cold), picks up LANE, loads it
# No purge here: the START_PRINT purge that follows does it. STUB (default from start_stub):
#   0 = leave the cut stub (~43 mm of the OLD filament) in the nozzle for that start purge to push
#       out: only if it purges well over 45 mm (BLOBIFIER does; a short line purge doesn't)
#   1 = push the stub out first, at load_park_xy (set it over the bucket / off the bed)
# TEMP=t: heat the nozzle to t and wait before the change (else the current target must already
# be >= min_melt_temp). LANE missing or < 0 (single-colour gcode without the parameter): nothing.
[gcode_macro HAT_START]
description: START_PRINT hook: put LANE (the first tool of the print) on the head and load it before the start purge. TEMP=t heats first; STUB=0 leaves the cut stub for the start purge
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(-1)|int %}
  {% set stub = params.STUB|default(c.start_stub)|int %}
  {% if lane < 0 %}
    RESPOND MSG="HatChanger: HAT_START without LANE, nothing to do (add INITIAL_TOOL=[initial_tool] to the slicer's START_PRINT line)"
  {% elif lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: HAT_START LANE=" ~ lane ~ " but only " ~ c.lane_x|length ~ " lanes are configured (lane_x)")}
  {% elif lane == st.lane|int and st.loaded|int %}
    RESPOND MSG="HatChanger: hat {lane} already loaded, no change before the start purge"
  {% else %}
    {% if params.TEMP is defined and printer.extruder.target|float < params.TEMP|float %}
      M109 S{params.TEMP|float}
    {% endif %}
    RESPOND MSG="HatChanger: print starts with lane {lane}, hat on the head: {st.lane if st.lane|int >= 0 else 'none'} - changing before the start purge"
    SAVE_GCODE_STATE NAME=hat_start
    HAT_PICKUP LANE={lane} STUB={stub}
    RESTORE_GCODE_STATE NAME=hat_start
  {% endif %}

[gcode_macro HAT_CHANGE]
description: Full change to LANE (unload, load, purge, return)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|int %}
  # with a purge macro, the purge pushes the cut stub out of the nozzle
  {% set stub = 0 if c.purge_macro else 1 %}
  {% if lane == st.lane|int and st.loaded|int %}
    RESPOND MSG="HatChanger: lane {lane} already loaded"
  {% elif lane == st.lane|int %}
    # its hat is on the head but not loaded to the nozzle (e.g. after a test): bring the tip to
    # the sensor, load, purge. No pickup.
    RESPOND MSG="HatChanger: hat {lane} is on the head but not loaded: loading it"
    _HAT_CHECK_READY
    SAVE_GCODE_STATE NAME=hat_change
    _HAT_GRAB_CHECK
    _HAT_LOAD_NOZZLE STUB={stub}
    {% if c.purge_macro %}{c.purge_macro}{% endif %}
    RESTORE_GCODE_STATE NAME=hat_change MOVE=1 MOVE_SPEED={c.travel_speed}
  {% else %}
    SAVE_GCODE_STATE NAME=hat_change
    {% if printer["gcode_macro _HAT_STATE"].lane|int >= 0 %}HAT_DOCK{% endif %}
    HAT_PICKUP LANE={lane} STUB={stub}
    {% if c.purge_macro %}{c.purge_macro}{% endif %}
    RESTORE_GCODE_STATE NAME=hat_change MOVE=1 MOVE_SPEED={c.travel_speed}
  {% endif %}

# Diagnostics: what the macros believe, and what the sensor says right now.
[gcode_macro HAT_STATUS]
description: Print HatChanger state (hat on the head, loaded, sensor, HAT_CAL_DOCK step)
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set seen = c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
  {% set lane = st.lane|int %}
  {% if lane < 0 %}
    {% set hint = "head empty: the sensor should read empty" ~ (" - it does NOT: a hat or a strand is on the head?" if seen else "") %}
  {% elif st.loaded|int %}
    {% set hint = "loaded to the nozzle: the sensor should read DETECTED" ~ (" - it does NOT: filament snapped or state wrong?" if not seen else "") %}
  {% else %}
    {% set hint = "not loaded: the tip is either at the sensor (after a pickup) or parked above it" %}
  {% endif %}
  RESPOND MSG="HatChanger: hat {lane if lane >= 0 else 'none'} | loaded {st.loaded} | sensor {'DETECTED' if seen else 'empty'} | HAT_CAL_DOCK step {st.align} | {hint}"
  RESPOND MSG="HatChanger: nozzle {printer.extruder.temperature|round(1)}/{printer.extruder.target} C | fix the state with HAT_SET_STATE LANE=.. LOADED=.."

# Alignment check, hat ON the head: walk the dock approach in stages and stop, so you can look
# (and jog) at each one. Never releases the hat; STEP=0 backs out the same way.
#   STEP=1  in front of the rack (dock_y_front), rails at slide height (dock_z + lift)
#   STEP=2  slid in to the plate (dock_y_in), rails still lift mm above the lower lips (mid-channel)
#   STEP=3  DOCKED: lowered onto the lower lips (dock_z - seat_press), exactly where HAT_DOCK releases the hat
#   STEP=0  back out: up to slide height, out to dock_y_front, down to the loaded travel height
# Going from one step to another only does the moves in between, so 1 -> 2 -> 3 -> 0 works.
[gcode_macro HAT_CAL_DOCK]
description: Hat on the head: stop at dock approach STEP 1/2/3 (3 = docked, 0 = back out) for checking alignment
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.align_lane if st.align|int > 0 else (st.lane if st.lane|int >= 0 else 0))|int %}
  {% set t = params.STEP|default(1)|int %}
  {% set a = st.align|int %}
  {% set s = 1 if c.dock_y_front > c.dock_y_in else -1 %}
  {% set y_pre = c.dock_y_in + s * c.plate_clear %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_raise_error("HatChanger: home the printer first")}
  {% endif %}
  {% if printer.quad_gantry_level is defined and not printer.quad_gantry_level.applied %}
    {action_raise_error("HatChanger: run QUAD_GANTRY_LEVEL first (dock Z depends on it)")}
  {% endif %}
  {% if t < 0 or t > 3 %}
    {action_raise_error("HatChanger: STEP must be 0..3")}
  {% endif %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  {% if a == 0 and st.lane|int < 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK needs the hat ON the head (state: head empty). It drives a loaded head into its own EMPTY rack; an empty head would hit the docked hat. Nothing moved. With an empty head use HAT_CAL_PICKUP LANE=" ~ lane)}
  {% endif %}
  {% if a == 0 and lane != st.lane|int %}
    {action_raise_error("HatChanger: hat " ~ st.lane ~ " is on the head, so only rack " ~ st.lane ~ " is empty: HAT_CAL_DOCK LANE=" ~ lane ~ " would hit the hat docked there. Nothing moved")}
  {% endif %}
  {% set p = printer.toolhead.position %}
  {% set in_zone = p.z > c.dock_z - c.z_clear_loaded + 0.5 and
                   ((p.y - c.dock_y_in) * s) < (c.dock_y_front - c.dock_y_in) * s - 0.5 %}
  {% if a == 0 and in_zone %}
    {action_raise_error("HatChanger: the head is at Z" ~ p.z ~ " Y" ~ p.y ~ ", inside a dock zone, but HAT_CAL_DOCK has no record of how it got there (restart?). Nothing moved. Jog it out by hand (Y towards " ~ c.dock_y_front ~ " at a height where the rails clear the lips, then Z down) - do not home with the head in a rack")}
  {% endif %}
  {% if a > 0 and lane != st.align_lane|int %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ a ~ " in rack " ~ st.align_lane ~ ", not " ~ lane ~ ": finish there first (STEP=0 LANE=" ~ st.align_lane ~ ")")}
  {% endif %}
  {% if a == t %}
    RESPOND MSG="HatChanger align: already at STEP={t}, nothing moved"
  {% else %}
  G90
  {% if a == 0 and t > 0 %}
    _HAT_GO_DOCK_FRONT LANE={lane}
    G1 Z{c.dock_z + c.lift} F{c.z_speed * 60}
    {% set a = 1 %}
  {% endif %}
  {% if t >= 2 and a < 2 %}
    G1 Y{y_pre} F{c.plate_speed * 60}
    G1 Y{c.dock_y_in} F{c.plate_speed * 60}
    {% set a = 2 %}
  {% endif %}
  {% if t >= 3 and a < 3 %}
    G1 Z{c.dock_z - c.seat_press} F{c.sync_speed * 60}
    {% set a = 3 %}
  {% endif %}
  {% if t <= 2 and a == 3 %}
    G1 Z{c.dock_z + c.lift} F{c.sync_speed * 60}
    {% set a = 2 %}
  {% endif %}
  {% if t <= 1 and a == 2 %}
    G1 Y{y_pre} F{c.plate_speed * 60}
    G1 Y{c.dock_y_front} F{c.plate_speed * 60}
    {% set a = 1 %}
  {% endif %}
  {% if t == 0 and a == 1 %}
    G1 Z{c.dock_z - c.z_clear_loaded} F{c.z_speed * 60}
    {% set a = 0 %}
  {% endif %}
  M400
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=align VALUE={t}
  SET_GCODE_VARIABLE MACRO=_HAT_STATE VARIABLE=align_lane VALUE={lane if t > 0 else -1}
  {% set msg = ["back out, at the loaded travel height",
                "in front of rack " ~ lane ~ ", rails at slide height: check X and the height of the rails vs the lips",
                "slid in to the plate, rails " ~ c.lift ~ " mm above the lower lips: check they clear both lips and the hat is flat against the plate",
                "DOCKED at X" ~ c.lane_x[lane] ~ " Y" ~ c.dock_y_in ~ " Z" ~ (c.dock_z - c.seat_press) ~ ": hat on the lower lips, flat against the plate (magnets ~0.3 mm short), still on the head"][t] %}
  RESPOND MSG="HatChanger align STEP={t}: {msg}"
  {% endif %}

# Calibration helper. EMPTY head only (no hat on it), hat sitting in the rack.
# Brings the head under LANE at the configured dock_y_in and stops GAP mm (default 5) below
# dock_z, without touching the hat or moving filament. Then jog up/X/Y by hand until the hat
# seats cleanly, read the position (GET_POSITION or the UI) and put it in lane_x / dock_y_in / dock_z.
[gcode_macro HAT_CAL_PICKUP]
description: Empty head: stop GAP mm under the docked hat of LANE, for jogging the dock position
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set lane = params.LANE|default(0)|int %}
  {% set gap = params.GAP|default(5)|float %}
  {% if printer["gcode_macro _HAT_STATE"].lane|int >= 0 %}
    {action_raise_error("HatChanger: run this with an EMPTY head (HAT_DOCK first)")}
  {% endif %}
  {% if c.sensor and printer["filament_switch_sensor " ~ c.sensor].filament_detected %}
    {action_raise_error("HatChanger: the state says the head is empty, but the sensor sees filament: a hat is on the head? It would hit the docked hat. Nothing moved")}
  {% endif %}
  {% if lane < 0 or lane >= c.lane_x|length %}
    {action_raise_error("HatChanger: invalid LANE")}
  {% endif %}
  _HAT_CHECK_READY DRY=1
  {% set p = printer.toolhead.position %}
  {% set ze = c.dock_z - c.z_clear %}
  G90
  G1 Z{[p.z, ze]|min} F{c.z_speed * 60}
  G1 X{c.lane_x[lane]} Y{c.dock_y_in} F{c.travel_speed * 60}
  G1 Z{c.dock_z - gap} F{c.approach_speed * 60}
  M400
  RESPOND MSG="HatChanger: lane {lane} at X{c.lane_x[lane]} Y{c.dock_y_in} Z{c.dock_z - gap}. Jog up slowly, check the stinger enters the seat centred."

# Phase-1 reliability test: pickup/drop the same lane COUNT times, no hotend loading.
# The extruder must be allowed to move (can_extrude), but the tip never goes further than the
# sensor (a loaded hat is cut and unloaded first). Works from either state: with the hat on the head
# it docks it first. Each cycle = pickup (grab checked by the sensor) + drop-off (pre-park on the
# sensor). Any failure stops the test with the error. DWELL=s pauses between cycles (default 0).
[gcode_macro HAT_TEST_LANE]
description: Dock/undock LANE COUNT times (pickup + drop-off, no nozzle loading), from either state. DRY=1: no filament, movements only
gcode:
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set lane = params.LANE|default(st.lane if st.lane|int >= 0 else 0)|int %}
  {% set n = params.COUNT|default(10)|int %}
  {% set dwell = (params.DWELL|default(0)|float * 1000)|int %}
  {% if st.align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ st.align ~ ", run HAT_CAL_DOCK STEP=0 first")}
  {% endif %}
  {% if st.lane|int >= 0 %}
    {% if st.lane|int != lane %}
      {action_raise_error("HatChanger: hat of lane " ~ st.lane ~ " is on the head, not lane " ~ lane)}
    {% endif %}
    RESPOND MSG="HatChanger test: hat on the head, docking it first"
    HAT_DOCK DRY={params.DRY|default(0)|int}
  {% endif %}
  {% for i in range(n) %}
    HAT_PICKUP LANE={lane} TO_NOZZLE=0 DRY={params.DRY|default(0)|int}
    HAT_DOCK CUT=0 DRY={params.DRY|default(0)|int}
    RESPOND MSG="HatChanger test cycle {i + 1}/{n} ok"
    {% if dwell > 0 %}G4 P{dwell}{% endif %}
  {% endfor %}
  RESPOND MSG="HatChanger test: {n} cycles done, hat docked"

# Multi-lane test: pick up and drop each lane of LANES in turn, COUNT rounds, no nozzle
# loading (same rules as HAT_TEST_LANE). Exercises the travel between racks too.
# LANES defaults to all lanes in lane_x, e.g. HAT_TEST_ALL COUNT=5 or LANES=1,0 DWELL=2.
[gcode_macro HAT_TEST_ALL]
description: Pick up / drop each lane of LANES (default: all) in turn, COUNT rounds, no nozzle loading. DRY=1: no filament, movements only
gcode:
  {% set c = printer["gcode_macro _HAT_CFG"] %}
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set all = range(c.lane_x|length)|list %}
  {% set lanes = (params.LANES.split(',')|map('int')|list) if params.LANES else all %}
  {% set n = params.COUNT|default(5)|int %}
  {% set dwell = (params.DWELL|default(0)|float * 1000)|int %}
  {% for l in lanes %}
    {% if l < 0 or l >= c.lane_x|length %}
      {action_raise_error("HatChanger: lane " ~ l ~ " is not in lane_x")}
    {% endif %}
  {% endfor %}
  {% if st.align|int != 0 %}
    {action_raise_error("HatChanger: HAT_CAL_DOCK is at STEP=" ~ st.align ~ ", run HAT_CAL_DOCK STEP=0 first")}
  {% endif %}
  {% if st.lane|int >= 0 %}
    RESPOND MSG="HatChanger test: hat {st.lane} on the head, docking it first"
    HAT_DOCK DRY={params.DRY|default(0)|int}
  {% endif %}
  {% for i in range(n) %}
    {% for l in lanes %}
      HAT_PICKUP LANE={l} TO_NOZZLE=0 DRY={params.DRY|default(0)|int}
      HAT_DOCK CUT=0 DRY={params.DRY|default(0)|int}
      RESPOND MSG="HatChanger lane test round {i + 1}/{n}: lane {l} ok"
      {% if dwell > 0 %}G4 P{dwell}{% endif %}
    {% endfor %}
  {% endfor %}
  RESPOND MSG="HatChanger lane test: {n} rounds over lanes {lanes} done, all hats docked"
