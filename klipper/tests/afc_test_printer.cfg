# Klipper batch-mode test printer for HatChanger + AFC (run_afc_test.py). Not a real printer:
# linux-process MCU dictionary, no hardware. The geometry only has to reach the dock.

[mcu]
serial: /dev/null

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 20
max_z_accel: 300

[stepper_x]
step_pin: gpio0
dir_pin: gpio1
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: gpio3
position_endstop: 0
position_max: 350
homing_speed: 50

[stepper_y]
step_pin: gpio4
dir_pin: gpio5
enable_pin: !gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: gpio7
position_endstop: 0
position_max: 350
homing_speed: 50

[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: gpio11
position_endstop: 0
position_max: 260

[extruder]
step_pin: gpio12
dir_pin: gpio14
enable_pin: !gpio15
microsteps: 16
rotation_distance: 22.6789511
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio16
sensor_type: temperature_host
min_temp: 0
max_temp: 300
min_extrude_temp: 0
max_extrude_only_distance: 200
max_extrude_only_velocity: 50
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[pause_resume]

[respond]

[virtual_sdcard]
path: {TMP}

[display_status]

[AFC]
VarFile: {TMP}/AFC.var
moonraker_host: http://127.0.0.1
moonraker_port: {PORT}
long_moves_speed: 150
long_moves_accel: 250
short_moves_speed: 50
short_moves_accel: 300
short_move_dis: 10
enable_sensors_in_gui: False
default_material_temps: default: 220
z_hop: 5
tool_cut: False
park: False
poop: True
poop_cmd: TEST_POOP
kick: False
wipe: False
form_tip: False

[AFC_prep]
enable: False

[AFC_form_tip]
cooling_tube_position: 35
cooling_tube_length: 10
cooling_moves: 4

[hat_sim]
grip_margin: 3.0
nip_to_sensor: 19.85
initial_tips: 36.35, 3.0

# test hook: let the simulator attribute extruder moves, then the real AFC hook
[gcode_macro _HAT_CFG]
variable_state_hook: '_TEST_STATE_HOOK'
variable_start_stub: 0              # the simulator doesn't model the cutter: keep tips above the blade

[gcode_macro _TEST_STATE_HOOK]
gcode:
  HAT_SIM_SETTLE
  AFC_HATCHANGER_SYNC UNIT=HatChanger_1 QUIET=1

[gcode_macro TEST_POOP]
variable_count: 0
gcode:
  SET_GCODE_VARIABLE MACRO=TEST_POOP VARIABLE=count VALUE={printer["gcode_macro TEST_POOP"].count + 1}
  HAT_SIM_NOTE MSG="TEST_POOP {rawparams}"

# EXPECT HAT=n LOADED=0|1 AFC=<lane>|None [POOPS=n]
[gcode_macro EXPECT]
gcode:
  {% set st = printer["gcode_macro _HAT_STATE"] %}
  {% set cur = printer.AFC.current_load %}
  {% set want_afc = params.AFC|default('None') %}
  {% if st.lane|int != params.HAT|int or st.loaded|int != params.LOADED|int %}
    {action_raise_error("EXPECT failed: HatChanger hat %s loaded %s, wanted hat %s loaded %s" % (st.lane, st.loaded, params.HAT, params.LOADED))}
  {% endif %}
  {% if (cur|string) != want_afc %}
    {action_raise_error("EXPECT failed: AFC current_load %s, wanted %s" % (cur, want_afc))}
  {% endif %}
  {% set pre = printer["AFC_extruder extruder"].tool_start_status %}
  {% if pre != (st.lane|int >= 0) %}
    {action_raise_error("EXPECT failed: AFC pre-extruder sensor %s with hat %s on the head" % (pre, st.lane))}
  {% endif %}
  {% if params.POOPS is defined and printer["gcode_macro TEST_POOP"].count != params.POOPS|int %}
    {action_raise_error("EXPECT failed: %d poops, wanted %s" % (printer["gcode_macro TEST_POOP"].count, params.POOPS))}
  {% endif %}
  HAT_SIM_NOTE MSG="EXPECT ok: hat {st.lane} loaded {st.loaded}, AFC {cur}, poops {printer['gcode_macro TEST_POOP'].count}"

# EXPECT_LANE LANE=<name> MATERIAL=<m>: the lane kept its data and isn't ejected
[gcode_macro EXPECT_LANE]
gcode:
  {% set l = printer["AFC_lane " ~ params.LANE] %}
  {% if l.material != params.MATERIAL or printer.AFC.current_state != "Idle" or not l.load %}
    {action_raise_error("EXPECT failed: lane %s material %s load %s, AFC state %s" % (params.LANE, l.material, l.load, printer.AFC.current_state))}
  {% endif %}
  HAT_SIM_NOTE MSG="EXPECT ok: {params.LANE} kept {l.material}, AFC {printer.AFC.current_state}"
